<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة مَلفى الإدارية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root{
  --sidebar-bg:#111111;
  --sidebar-ink:#F6F4F0;
  --sidebar-ink-dim:rgba(246,244,240,.55);
  --sidebar-active:rgba(83,50,139,.4);
  --content-bg:#F6F4F0;
  --card-bg:#FFFFFF;
  --ink:#111111;
  --ink-2:#55504A;
  --ink-3:#8A857C;
  --rule:rgba(17,17,17,.1);
  --rule-2:rgba(17,17,17,.16);
  --khz:#53328B;
  --khz-tint:rgba(83,50,139,.08);
  --success:#2F7D4F;
  --success-tint:rgba(47,125,79,.1);
  --danger:#B23A3A;
  --danger-tint:rgba(178,58,58,.1);
  --warn:#B8802A;
  --warn-tint:rgba(184,128,42,.12);
  --r1:8px;--r2:12px;--r3:16px;
  --sidebar-w:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--content-bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
::selection{background:var(--khz-tint)}

/* ---------- name highlight, one quiet brand touch ---------- */
.kh-hi{position:relative;display:inline-block}
.kh-hi::after{content:"";position:absolute;right:0;left:0;bottom:-2px;height:2px;background:var(--khz);opacity:.55}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--sidebar-bg);color:var(--sidebar-ink);
  display:flex;flex-direction:column;position:fixed;inset-inline-end:0;top:0;bottom:0;z-index:20}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.sidebar-brand svg{width:26px;height:26px;color:var(--sidebar-ink)}
.sidebar-brand b{font-size:16px;font-weight:700}
.sidebar-nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r1);
  color:var(--sidebar-ink-dim);font-size:13.5px;font-weight:500;text-align:start;width:100%;
  transition:background 120ms ease,color 120ms ease}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--sidebar-ink)}
.nav-item.on{background:var(--sidebar-active);color:#fff}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08)}
.admin-id{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:var(--khz);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.admin-meta{min-width:0}
.admin-meta .n{font-size:13px;font-weight:600;color:var(--sidebar-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-meta .r{font-size:11.5px;color:var(--sidebar-ink-dim)}
.signout-btn{display:flex;align-items:center;gap:8px;color:var(--sidebar-ink-dim);font-size:12.5px;
  padding:8px 4px;width:100%;border-radius:var(--r1);transition:color 120ms ease}
.signout-btn:hover{color:#fff}
.signout-btn svg{width:15px;height:15px}

.main{flex:1;margin-inline-end:var(--sidebar-w);min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  border-bottom:1px solid var(--rule);background:var(--content-bg);position:sticky;top:0;z-index:10}
.topbar h1{font-size:19px;font-weight:700;margin:0}
.topbar-right{display:flex;align-items:center;gap:16px;color:var(--ink-3);font-size:12.5px}
.bell{width:18px;height:18px;position:relative}
.bell .dot{position:absolute;top:-2px;left:-2px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.content{padding:24px 28px 60px;max-width:1320px}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card-bg);border:1px solid var(--rule);border-radius:var(--r2);padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kpi.warn .v{color:var(--warn)}
.kpi.danger .v{color:var(--danger)}

.charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:28px}
@media (max-width:900px){.charts-row{grid-template-columns:1fr}}
.card{background:var(--card-bg);border:1px solid var(--rule);border-radius:var(--r2);padding:18px}
.card h3{font-size:14px;font-weight:700;margin:0 0 14px}

/* ---------- table ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1px solid var(--rule-2);
  border-radius:var(--r1);padding:8px 12px;min-width:220px}
.search-box svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.search-box input{border:0;outline:0;background:none;width:100%;font-size:13px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--rule-2);font-size:12px;color:var(--ink-2);
  white-space:nowrap;transition:background 120ms ease,color 120ms ease}
.chip:hover{background:var(--khz-tint)}
.chip.on{background:var(--khz);color:#fff;border-color:var(--khz)}
.select-box{padding:8px 10px;border:1px solid var(--rule-2);border-radius:var(--r1);font-size:12.5px;background:var(--card-bg)}

.table-wrap{background:var(--card-bg);border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:920px}
thead th{text-align:start;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:12px 14px;
  border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0;background:var(--card-bg)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arrow{font-size:10px;margin-inline-start:3px;opacity:.6}
tbody td{padding:12px 14px;border-bottom:1px solid var(--rule);font-size:13px;white-space:nowrap}
tbody tr{transition:background 100ms ease;cursor:pointer}
tbody tr:hover{background:var(--khz-tint)}
tbody tr:last-child td{border-bottom:0}
.name-cell{display:flex;align-items:center;gap:10px}
.mini-avatar{width:28px;height:28px;border-radius:50%;background:var(--rule);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px}
.status-dot.on{background:var(--success)}
.status-dot.off{background:var(--ink-3);opacity:.4}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge.free{background:var(--rule);color:var(--ink-2)}
.badge.paid{background:var(--khz-tint);color:var(--khz)}
.badge.trial{background:var(--warn-tint);color:var(--warn)}
.badge.expired{background:var(--danger-tint);color:var(--danger)}
.badge.success{background:var(--success-tint);color:var(--success)}
.badge.failure{background:var(--danger-tint);color:var(--danger)}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12.5px;color:var(--ink-3)}
.pagination .btns{display:flex;gap:6px}
.pagination button{padding:6px 12px;border:1px solid var(--rule-2);border-radius:var(--r1);font-size:12.5px}
.pagination button:disabled{opacity:.35;cursor:default}
.pagination button:not(:disabled):hover{background:var(--khz-tint)}

/* ---------- states ---------- */
.state{padding:60px 20px;text-align:center;color:var(--ink-3)}
.state svg{width:34px;height:34px;margin-bottom:12px;opacity:.5}
.state h4{font-size:14px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.state p{font-size:12.5px;margin:0}
.state button{margin-top:12px;padding:8px 16px;border:1px solid var(--rule-2);border-radius:var(--r1);font-size:12.5px}
.skeleton{background:linear-gradient(90deg,var(--rule) 25%,var(--rule-2) 37%,var(--rule) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- side panel ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:29;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.overlay.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(440px,92vw);background:var(--card-bg);
  z-index:30;box-shadow:0 0 40px rgba(0,0,0,.15);transform:translateX(-100%);transition:transform 240ms cubic-bezier(.23,1,.32,1);
  overflow-y:auto}
[dir="rtl"] .panel{transform:translateX(100%)}
.panel.on{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--card-bg)}
.panel-head h2{font-size:16px;margin:0}
.panel-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.panel-close:hover{background:var(--rule)}
.panel-body{padding:20px 22px}
.panel-sec{margin-bottom:22px}
.panel-sec h4{font-size:11.5px;color:var(--ink-3);font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3)}
.timeline-i{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.timeline-i:last-child{border-bottom:0}
.timeline-i .d{width:7px;height:7px;border-radius:50%;background:var(--khz);margin-top:6px;flex:none}
.timeline-i .b{flex:1;min-width:0}
.timeline-i .e{font-size:13px;font-weight:600}
.timeline-i .t{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg)}
.login-card{width:360px;background:var(--card-bg);border-radius:var(--r3);padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-brand svg{width:24px;height:24px;color:var(--khz)}
.login-brand b{font-size:16px}
.login-card h1{font-size:19px;margin:0 0 6px}
.login-card p.sub{font-size:12.5px;color:var(--ink-3);margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r1);font-size:13.5px;outline:0}
.field input:focus{border-color:var(--khz)}
.login-err{font-size:12px;color:var(--danger);margin:4px 0 0}
.login-btn{width:100%;padding:11px;background:var(--khz);color:#fff;border-radius:var(--r1);font-size:13.5px;
  font-weight:600;margin-top:6px;transition:opacity 120ms ease}
.login-btn:disabled{opacity:.6}
.login-btn:not(:disabled):hover{opacity:.9}

.hidden{display:none !important}
.mono{font-variant-numeric:tabular-nums;direction:ltr;text-align:end;display:inline-block}

@media (max-width:860px){
  .sidebar{width:100%;position:relative;inset-inline-end:auto;flex-direction:row;align-items:center;padding:0;height:56px}
  .sidebar-brand{padding:0 14px}
  .sidebar-nav{flex-direction:row;overflow-x:auto;padding:0 8px}
  .nav-item span{display:none}
  .sidebar-foot{display:none}
  .main{margin-inline-end:0}
  .shell{flex-direction:column}
  .content{padding:16px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

var sb = window.supabase.createClient(
  'https://ntpwnrsckacwqzvgoysb.supabase.co',
  'sb_publishable_gM0UmkhBzwUNGVV3OnxfFA_IRey-gUp'
);
var FUNC_URL = 'https://ntpwnrsckacwqzvgoysb.supabase.co/functions/v1/admin-api';

var app = document.getElementById('app');
var STATE = { session:null, isAdmin:false, adminName:'', tab:'overview',
  usersPage:1, usersFilter:'', usersSearch:'', usersSort:'created_desc',
  eventsPage:1, eventsFilter:'', panelUser:null };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}) + ' · ' +
    d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
}
function relTime(iso){
  if(!iso) return 'أبدًا';
  var s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 60) return 'الآن';
  if(s < 3600) return 'قبل ' + Math.floor(s/60) + ' د';
  if(s < 86400) return 'قبل ' + Math.floor(s/3600) + ' س';
  return 'قبل ' + Math.floor(s/86400) + ' يوم';
}
function initials(name,email){
  var n = (name||'').trim();
  if(n) return n.charAt(0);
  return (email||'؟').charAt(0).toUpperCase();
}

var ICONS = {
  logo:'<path d="M2 12c3 2 7 3 10 3s7-1 10-3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M21 20c0-2.8-1.8-5-4.5-5.6"/>',
  activity:'<path d="M3 12h4l2-7 4 14 2-7h6"/>',
  plans:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  signout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  chevron:'<path d="M15 18l-6-6 6-6"/>',
  empty:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  warn:'<path d="M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  retry:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/>'
};
function ic(name,size){
  size = size||18;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
}

/* ============================================================
   API — every call carries the admin's own JWT; the edge
   function independently re-verifies admin status server-side
   ============================================================ */
/* every caller gets {ok,status,body}; a 401 (expired/invalid session) is
   handled once, centrally, here — sign out and return to login — so no
   individual tab loader has to remember to check for it itself */
function api(action, params){
  params = params || {};
  var url = new URL(FUNC_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(function(k){ if(params[k] !== '' && params[k] != null) url.searchParams.set(k, params[k]); });
  return sb.auth.getSession().then(function(res){
    var token = res.data.session ? res.data.session.access_token : '';
    return fetch(url.toString(), {
      headers: { 'Authorization': 'Bearer ' + token, 'apikey': 'sb_publishable_gM0UmkhBzwUNGVV3OnxfFA_IRey-gUp' }
    });
  }).then(function(r){
    return r.json().then(function(body){ return { ok:r.ok, status:r.status, body:body }; });
  }).catch(function(){
    return { ok:false, status:0, body:{ error:'network' } };
  }).then(function(res){
    if(res.status === 401){
      sb.auth.signOut().then(function(){ boot(); });
      return { ok:false, status:401, body:{ error:'session_expired' }, handled:true };
    }
    return res;
  });
}

/* ============================================================
   BOOT / AUTH
   ============================================================ */
function boot(){
  render(loginHTML());
  sb.auth.getSession().then(function(res){
    if(res.data.session){ enterWithSession(res.data.session); }
  });
}
function enterWithSession(session){
  STATE.session = session;
  render(loadingShellHTML());
  api('stats').then(function(res){
    if(res.handled) return; // api() already signed out + returned to login
    if(res.status === 403){
      STATE.isAdmin = false;
      render(deniedHTML());
      return;
    }
    if(!res.ok){
      render(errorShellHTML());
      return;
    }
    STATE.isAdmin = true;
    sb.from('profiles').select('name').eq('id', session.user.id).single().then(function(p){
      STATE.adminName = (p.data && p.data.name) || session.user.email;
      STATE.tab = 'overview';
      mountApp();
    });
  });
}

function loginHTML(notice){
  return '<div class="login-wrap"><div class="login-card">'
    + '<div class="login-brand">'+ic('logo',22)+'<b>لوحة مَلفى</b></div>'
    + '<h1>تسجيل الدخول</h1><p class="sub">دخول مخصص لفريق مَلفى الإداري فقط.</p>'
    + (notice ? '<p class="login-err">'+esc(notice)+'</p>' : '')
    + '<div class="field"><label>البريد الإلكتروني</label><input type="email" id="lEmail" autocomplete="username"></div>'
    + '<div class="field"><label>كلمة المرور</label><input type="password" id="lPass" autocomplete="current-password"></div>'
    + '<p class="login-err" id="lErr"></p>'
    + '<button class="login-btn" id="lBtn">دخول</button>'
    + '</div></div>';
}
function deniedHTML(){
  return '<div class="login-wrap"><div class="login-card" style="text-align:center">'
    + '<div class="login-brand" style="justify-content:center">'+ic('logo',22)+'<b>لوحة مَلفى</b></div>'
    + '<div class="state" style="padding:10px 0 6px">'+ic('warn',30)
    + '<h4>ما عندك صلاحية الوصول</h4><p>هذا الحساب مسجّل دخول لكن ما له صلاحية إدارية على لوحة مَلفى.</p></div>'
    + '<button class="login-btn" id="dSignout">تسجيل خروج</button>'
    + '</div></div>';
}
function loadingShellHTML(){
  return '<div class="login-wrap"><div style="color:#F6F4F0;font-size:13px">جارٍ التحقق…</div></div>';
}
function errorShellHTML(){
  return '<div class="login-wrap"><div class="login-card" style="text-align:center">'
    + '<div class="state">'+ic('warn',30)+'<h4>تعذّر الاتصال</h4><p>صار خطأ بالشبكة. حاول مرة ثانية.</p>'
    + '<button id="retryBoot">إعادة المحاولة'+ic('retry',14)+'</button></div></div></div>';
}

document.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('#lBtn'))){ doLogin(); return; }
  if((t = e.target.closest('#dSignout'))){ sb.auth.signOut().then(boot); return; }
  if((t = e.target.closest('#retryBoot'))){ boot(); return; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.getElementById('lPass')) doLogin();
});
function doLogin(){
  var email = (document.getElementById('lEmail').value||'').trim();
  var pass = document.getElementById('lPass').value||'';
  var err = document.getElementById('lErr');
  var btn = document.getElementById('lBtn');
  err.textContent = '';
  if(!email || !pass){ err.textContent = 'عبّي البريد وكلمة المرور.'; return; }
  btn.disabled = true; btn.textContent = 'لحظة…';
  sb.auth.signInWithPassword({ email:email, password:pass }).then(function(res){
    if(res.error){
      btn.disabled = false; btn.textContent = 'دخول';
      err.textContent = 'البريد أو كلمة المرور غير صحيحة.';
      return;
    }
    enterWithSession(res.data.session);
  });
}

   OVERVIEW
   ============================================================ */
function skeletonKpis(){
  var out = '<div class="kpi-grid">';
  for(var i=0;i<9;i++) out += '<div class="kpi"><div class="skeleton" style="height:11px;width:60%"></div><div class="skeleton" style="height:24px;width:40%;margin-top:10px"></div></div>';
  return out + '</div>';
}
function renderOverview(c){
  c.innerHTML = skeletonKpis() + '<div class="card"><div class="skeleton" style="height:180px"></div></div>';
  api('stats').then(function(res){
    if(res.handled) return;
    if(!res.ok){ c.innerHTML = networkErrorHTML('renderOverview'); return; }
    var s = res.body;
    var kpis = [
      {l:'إجمالي المستخدمين', v:s.total_users, s:''},
      {l:'نشط الآن', v:s.active_now, s:'خلال '+s.active_now_window_minutes+' دقائق'},
      {l:'مستخدمون جدد اليوم', v:s.new_today, s:''},
      {l:'مستخدمون جدد هذا الشهر', v:s.new_month, s:''},
      {l:'خطة مجانية', v:s.free_users, s:''},
      {l:'خطة مدفوعة', v:s.paid_users, s: s.has_plans_configured ? '' : 'لا خطط مُفعّلة بعد'},
      {l:'تسجيل دخول اليوم', v:s.signins_today, s:''},
      {l:'محاولات فاشلة اليوم', v:s.failed_signins_today, s:'', cls: s.failed_signins_today>0?'danger':''},
      {l:'غير نشط 7+ أيام', v:s.inactive_7d, s:'', cls: s.inactive_7d>0?'warn':''}
    ];
    var kpiHTML = '<div class="kpi-grid">' + kpis.map(function(k){
      return '<div class="kpi'+(k.cls?(' '+k.cls):'')+'"><div class="l">'+k.l+'</div><div class="v mono">'+k.v+'</div>'
        + (k.s?'<div class="s">'+k.s+'</div>':'')+'</div>';
    }).join('') + '</div>';

    var maxG = Math.max(1, Math.max.apply(null, s.growth.map(function(g){return g.count;})));
    var barW = 100/s.growth.length;
    var growthBars = s.growth.map(function(g,i){
      var h = Math.max(2, (g.count/maxG)*100);
      var day = new Date(g.day).toLocaleDateString('ar-SA',{day:'numeric',month:'numeric'});
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px" title="'+day+': '+g.count+'">'
        + '<div style="width:60%;height:110px;display:flex;align-items:flex-end">'
          + '<div style="width:100%;height:'+h+'%;background:var(--khz);border-radius:3px 3px 0 0;min-height:2px"></div></div>'
        + '<span style="font-size:9.5px;color:var(--ink-3)">'+day+'</span></div>';
    }).join('');

    var planTotal = s.free_users + s.paid_users;
    var freeW = planTotal ? Math.round(s.free_users/planTotal*100) : 0;
    var paidW = planTotal ? 100-freeW : 0;
    var planChart = '<div style="display:flex;flex-direction:column;gap:14px">'
      + '<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">'
        + '<span>مجانية</span><span class="mono">'+s.free_users+'</span></div>'
        + '<div style="height:8px;background:var(--rule);border-radius:4px;overflow:hidden">'
          + '<div style="width:'+freeW+'%;height:100%;background:var(--ink-3)"></div></div></div>'
      + '<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">'
        + '<span>مدفوعة</span><span class="mono">'+s.paid_users+'</span></div>'
        + '<div style="height:8px;background:var(--rule);border-radius:4px;overflow:hidden">'
          + '<div style="width:'+paidW+'%;height:100%;background:var(--khz)"></div></div></div>'
      + (s.has_plans_configured ? '' : '<p style="font-size:11.5px;color:var(--ink-3);margin:4px 0 0">لا يوجد نظام خطط مُفعّل في التطبيق بعد — كل المستخدمين مصنّفون «مجانية» افتراضيًا.</p>')
      + '</div>';

    c.innerHTML = kpiHTML
      + '<div class="charts-row">'
        + '<div class="card"><h3>نمو المستخدمين — آخر 14 يوم</h3><div style="display:flex;align-items:flex-end;gap:4px">'+growthBars+'</div></div>'
        + '<div class="card"><h3>توزيع الخطط</h3>'+planChart+'</div>'
      + '</div>';
  });
}

var USER_FILTERS = [
  {k:'', l:'الكل'}, {k:'active_now', l:'نشط الآن'}, {k:'online_recently', l:'نشط مؤخرًا'},

function renderUsers(c){

function usersToolbarHTML(){
  return '<div class="toolbar">'
    + '<div class="search-box">'+ic('search',15)+'<input type="text" id="userSearch" placeholder="ابحث بالاسم أو البريد" value="'+esc(STATE.usersSearch)+'"></div>'
    + '<select class="select-box" id="userSort">'
      + '<option value="created_desc"'+(STATE.usersSort==='created_desc'?' selected':'')+'>الأحدث تسجيلًا</option>'
      + '<option value="last_seen_desc"'+(STATE.usersSort==='last_seen_desc'?' selected':'')+'>آخر ظهور</option>'

    + '</select>'

        return '<button class="chip'+(STATE.usersFilter===f.k?' on':'')+'" data-ufilter="'+f.k+'">'+f.l+'</button>';
      }).join('') + '</div>';

function wireUsersToolbar(){
  var s = document.getElementById('userSearch');
  var srt = document.getElementById('userSort');
  if(s){ s.addEventListener('input', debounce(function(){ STATE.usersSearch = s.value; STATE.usersPage=1; loadUsers(); }, 300)); }
  if(srt){ srt.addEventListener('change', function(){ STATE.usersSort = srt.value; loadUsers(); }); }
}
function debounce(fn, ms){ var t; return function(){ var a=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(null,a); }, ms); }; }

document.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-ufilter]'))){
    STATE.usersFilter = t.dataset.ufilter; STATE.usersPage = 1;
    document.querySelectorAll('[data-ufilter]').forEach(function(x){ x.classList.toggle('on', x.dataset.ufilter===STATE.usersFilter); });
    loadUsers();
    return;
  }
  if((t = e.target.closest('[data-userpage]'))){ STATE.usersPage = parseInt(t.dataset.userpage,10); loadUsers(); return; }
  if((t = e.target.closest('tr[data-uid]'))){ openUserPanel(t.dataset.uid); return; }
  if((t = e.target.closest('[data-eventpage]'))){ STATE.eventsPage = parseInt(t.dataset.eventpage,10); loadEvents(); return; }
  if((t = e.target.closest('[data-efilter]'))){
    STATE.eventsFilter = t.dataset.efilter; STATE.eventsPage = 1;
    document.querySelectorAll('[data-efilter]').forEach(function(x){ x.classList.toggle('on', x.dataset.efilter===STATE.eventsFilter); });
    loadEvents();
    return;
  }
});

function skeletonTable(rows){
  var r = '';
  for(var i=0;i<rows;i++) r += '<div style="padding:14px 16px"><div class="skeleton" style="height:14px;width:'+(60+Math.random()*30)+'%"></div></div>';
  return r;
}
function networkErrorHTML(retryFn){
  return '<div class="state">'+ic('warn',30)+'<h4>صار خطأ بالشبكة</h4><p>تعذّر تحميل البيانات.</p>'
    + '<button data-retry="'+retryFn+'">حاول ثانية'+ic('retry',13)+'</button></div>';
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-retry]');
  if(t){
    if(t.dataset.retry==='renderOverview') renderOverview(document.getElementById('tabContent'));
    if(t.dataset.retry==='loadUsers') loadUsers();
    if(t.dataset.retry==='loadEvents') loadEvents();
    if(t.dataset.retry==='loadPlans') renderPlans(document.getElementById('tabContent'));
  }
});

function loadUsers(){
  var holder = document.getElementById('usersTableHolder');
  api('users', { page:STATE.usersPage, per_page:25, search:STATE.usersSearch, filter:STATE.usersFilter, sort:STATE.usersSort })
    .then(function(res){
      if(res.handled) return;
      if(!res.ok){ holder.innerHTML = networkErrorHTML('loadUsers'); return; }
      var d = res.body;
      if(!d.rows.length){
        holder.innerHTML = '<div class="state">'+ic('empty',30)+'<h4>ولا نتيجة</h4><p>'+
          (STATE.usersSearch||STATE.usersFilter ? 'جرّب بحثًا أو فلترًا مختلفًا.' : 'ما فيه مستخدمين مسجّلين بعد.')+'</p></div>';
        return;
      }
      holder.innerHTML = '<table><thead><tr>'
        + '<th>المستخدم</th><th>الحالة</th><th>الخطة</th><th>تاريخ التسجيل</th>'
        + '<th>آخر دخول</th><th>آخر ظهور</th><th>طريقة الدخول</th></tr></thead><tbody>'
        + d.rows.map(userRowHTML).join('') + '</tbody></table>'
        + paginationHTML(d.page, d.per_page, d.total, 'data-userpage');
    });
}
function userRowHTML(u){
  var planCls = u.plan_status==='active'?'paid':u.plan_status;
  var planLabel = {free:'مجانية',active:'مدفوعة',trial:'تجريبية',expired:'منتهية',cancelled:'ملغاة'}[u.plan_status]||u.plan_status;
  return '<tr data-uid="'+u.id+'">'
    + '<td><div class="name-cell"><span class="mini-avatar">'+esc(initials(u.name,u.email))+'</span>'
      + '<span><div>'+esc(u.name||'—')+'</div><div style="font-size:11.5px;color:var(--ink-3)">'+esc(u.email)+'</div></span></div></td>'
    + '<td><span class="status-dot '+(u.is_online?'on':'off')+'"></span>'+(u.is_online?'نشط الآن':'غير متصل')+'</td>'
    + '<td><span class="badge '+planCls+'">'+planLabel+'</span></td>'
    + '<td class="mono">'+fmtDate(u.created_at)+'</td>'
    + '<td class="mono">'+(u.last_sign_in_at?relTime(u.last_sign_in_at):'أبدًا')+'</td>'
    + '<td class="mono">'+relTime(u.last_seen_at)+'</td>'
    + '<td>'+esc(u.auth_method)+'</td>'
    + '</tr>';
}
function paginationHTML(page, perPage, total, attr){
  var pages = Math.max(1, Math.ceil(total/perPage));
  return '<div class="pagination"><span>'+total+' مستخدم — صفحة '+page+' من '+pages+'</span>'
    + '<div class="btns">'
      + '<button '+attr+'="'+(page-1)+'" '+(page<=1?'disabled':'')+'>'+ic('chevron',13)+'</button>'
      + '<button '+attr+'="'+(page+1)+'" '+(page>=pages?'disabled':'')+' style="transform:scaleX(-1);display:inline-flex">'+ic('chevron',13)+'</button>'
    + '</div></div>';
}

    }
    c.innerHTML = '<div class="table-wrap"><div class="table-scroll"><table><thead><tr>'
      + '<th>الخطة</th><th>الحالة</th><th>عدد المستخدمين</th><th>أُنشئت</th></tr></thead><tbody>'
      + d.plans.map(function(p){
          return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.status)+'</td><td class="mono">'+p.active_users+'</td>'
            + '<td class="mono">'+fmtDate(p.created_at)+'</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  });
}

/* ============================================================
   SETTINGS (minimal — identity + sign out only, per the top bar spec)
   ============================================================ */
function renderSettings(c){
  c.innerHTML = '<div class="card" style="max-width:420px">'
    + '<h3>هويتك</h3>'
    + '<div class="kv"><span class="k">الاسم</span><span>'+esc(STATE.adminName)+'</span></div>'
    + '<div class="kv"><span class="k">صلاحية</span><span class="badge paid">مدير</span></div>'
    + '<p style="font-size:12px;color:var(--ink-3);margin-top:16px">إعدادات إضافية (صلاحيات فرعية، إشعارات، تدقيق) — قريبًا.</p>'
    + '</div>';
}

boot();
})();
</script>
