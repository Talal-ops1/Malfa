/* ---------- theme: light / dark / system ----------
   :root above holds the dark values (the app's default). An explicit
   data-theme="light" always wins; with no explicit choice, the system's
   prefers-color-scheme decides ("system" mode). data-theme="dark" just
   reasserts the :root defaults, so no separate dark block is needed. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#FAF7F1;--ground-2:#F0EADC;--rule:rgba(23,17,10,.08);--rule-2:rgba(23,17,10,.16);
    --ink:#1A1620;--ink-2:#5C5568;--ink-3:#8B8494;--khz-txt:#6B3FA0;--coral:#D63F4B;
    --chrome-70:rgba(250,247,241,.75);--chrome-78:rgba(250,247,241,.82);--chrome-9:rgba(250,247,241,.92);
  }
  body:not([data-theme="dark"]){background:#F0EADC}
  :root:not([data-theme="dark"]) .stage{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#F0EADC 60%)}
  :root:not([data-theme="dark"]) .phone{box-shadow:0 0 0 10px #E4DCC9,0 0 0 11px rgba(0,0,0,.05),0 44px 100px -30px rgba(0,0,0,.22)}
  :root:not([data-theme="dark"]) .statusbar{color:var(--ink)}
  :root:not([data-theme="dark"]) .open-q{color:var(--khz-txt)}
}
:root[data-theme="light"]{
  --ground:#FAF7F1;--ground-2:#F0EADC;--rule:rgba(23,17,10,.08);--rule-2:rgba(23,17,10,.16);
  --ink:#1A1620;--ink-2:#5C5568;--ink-3:#8B8494;--khz-txt:#6B3FA0;--coral:#D63F4B;
  --chrome-70:rgba(250,247,241,.75);--chrome-78:rgba(250,247,241,.82);--chrome-9:rgba(250,247,241,.92);
}
body[data-theme="light"]{background:#F0EADC}
:root[data-theme="light"] .stage{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#F0EADC 60%)}
:root[data-theme="light"] .phone{box-shadow:0 0 0 10px #E4DCC9,0 0 0 11px rgba(0,0,0,.05),0 44px 100px -30px rgba(0,0,0,.22)}
:root[data-theme="light"] .statusbar{color:var(--ink)}
:root[data-theme="light"] .open-q{color:var(--khz-txt)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* one consistent keyboard-focus ring for every interactive element — visible
   only for keyboard/non-pointer focus, so touch and mouse taps stay quiet */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
[contenteditable="true"]:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--khz-txt);outline-offset:2px;border-radius:6px}
.cv:focus-visible{outline:2px solid var(--khz-txt);outline-offset:3px}
body{margin:0;background:#050406;font-family:var(--f-u);color:var(--ink)}

.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:36px 16px;

.plan-trial-tag{display:inline-flex;font-family:var(--f-u);font-size:10.5px;font-weight:600;color:var(--ink-3);
  border:1px solid var(--rule-2);border-radius:99px;padding:3px 9px;margin-top:9px}
.plan-features{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:11px}
.plan-features li{display:flex;align-items:center;gap:10px;font-family:var(--f-u);font-size:13.5px;color:var(--ink-2);line-height:1.5}
.feat-check{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--khz-txt);background:color-mix(in srgb,var(--khz) 16%,transparent)}
.plan-card .btn{margin-top:24px;transition:transform var(--press-out) var(--ease-out),background var(--press-out) ease,box-shadow var(--t2) var(--ease-out)}
.plan-card .btn-fill:hover{box-shadow:0 6px 16px -4px color-mix(in srgb,var(--khz) 55%,transparent)}
@media (prefers-reduced-motion:reduce){.plan-card,.plan-card .btn{transition:none}.plan-card:hover{transform:none}}
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:var(--r2)}
.cmp-table{width:100%;min-width:420px;border-collapse:collapse;font-family:var(--f-u)}
.cmp-table th,.cmp-table td{padding:13px 14px;text-align:center;font-size:13.5px;border-bottom:1px solid var(--rule)}
.cmp-table th[scope="row"]{text-align:start;font-weight:500;color:var(--ink);white-space:nowrap}
.cmp-table thead th{color:var(--ink-3);font-weight:700;font-size:11.5px;letter-spacing:.02em;padding-top:14px;
  background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cmp-table thead th:not([scope="row"]):last-child{color:var(--khz-txt)}
.cmp-table tbody tr{transition:background var(--t1) ease}
.cmp-table tbody tr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cmp-table tbody tr:last-child td{border-bottom:0}
.cmp-yes{display:inline-flex;align-items:center;gap:5px;color:var(--khz-txt);font-weight:600}
.cmp-no{color:var(--ink-3)}
.feat-lock{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-u);font-size:10.5px;font-weight:700;
  color:var(--khz-txt);background:color-mix(in srgb,var(--khz) 14%,transparent);border-radius:99px;
  padding:3px 9px;margin-inline-start:8px;vertical-align:middle}
.feat-lock .ic{width:11px;height:11px}
.row .feat-lock{margin-inline-start:10px}
.lp-closing{padding:70px var(--pad);text-align:center;border-top:1px solid var(--rule);margin-top:20px}
.lp-footer{padding:36px var(--pad) 40px;border-top:1px solid var(--rule)}
.lp-footer-grid{display:grid;grid-template-columns:1fr;gap:26px;max-width:900px;margin:0 auto}
.lp-footer-col h4{font-family:var(--f-u);font-size:12.5px;font-weight:700;color:var(--ink-3);margin:0 0 12px}
.lp-footer-col a,.lp-footer-col button{display:block;font-family:var(--f-u);font-size:13.5px;color:var(--ink-2);
  min-height:36px;line-height:36px;text-align:start;width:100%}
.lp-footer-bottom{text-align:center;margin-top:30px;padding-top:22px;border-top:1px solid var(--rule)}
.lp-footer-bottom p{font-family:var(--f-u);font-size:12px;color:var(--ink-3);margin:4px 0}

/* ============================================================
   HOME — type opens the screen, not a colour block
   ============================================================ */
.open-q{font-family:var(--f-d);font-size:31px;font-weight:700;line-height:1.44;margin:8px 0 0}
/* the post-login hero — full-bleed within the content column, never a
   bordered/side-aligned card, so it reads as the page's entry point rather
   than another widget in the list. */
.home-hero{position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset-inline:-10%;top:-160px;height:320px;z-index:0;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 30%,color-mix(in srgb,var(--khz) 15%,transparent),transparent 72%)}
.home-hero .pad{position:relative;z-index:1}
.home-hero-q{font-size:34px}
.home-hero-sub{font-family:var(--f-u);font-size:15.5px;color:var(--ink-2);margin:10px 0 0;line-height:1.7;max-width:44ch}
.home-hero-cta{margin-top:22px}
@media (min-width:1024px){
  .home-hero-q{font-size:38px}
  .home-hero-sub{font-size:16.5px}
}
/* a quiet, hand-marked touch behind a name — not a redesign, just one warm accent */
.kh-hi{position:relative;display:inline-block;padding:0 2px;color:inherit}
.kh-hi::before{content:"";position:absolute;inset:30% -3px 4% -3px;background:#4A2F73;opacity:.55;
  border-radius:3px 7px 4px 8px;transform:rotate(-.6deg);z-index:-1}
.now{display:flex;gap:16px;align-items:flex-start;padding-inline:var(--pad)}
.now-b{flex:1;min-width:0;padding-top:2px}
.now-t{font-family:var(--f-d);font-size:21px;font-weight:700;line-height:1.4;margin:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.bar{height:2px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--khz-txt)}
.menara-intro{font-family:var(--f-d);font-size:20px;font-weight:600;line-height:1.7;color:var(--ink);
  text-align:center;max-width:30ch;margin:0 auto;padding:34px var(--pad) 30px}
.refl-lead{display:flex;align-items:center;gap:7px;color:var(--khz-txt)}
.refl-lead span{font-family:var(--f-u);font-size:11.5px;font-weight:600}
.refl-q{font-family:var(--f-d);font-size:18px;font-weight:400;line-height:1.85;margin:10px 0 0;color:var(--ink)}
.refl-q.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.refl-more{margin-top:6px;display:none}
.refl-row{display:flex;align-items:center;gap:11px;margin-top:14px}
.play{width:34px;height:34px;border-radius:50%;background:var(--khz);color:#fff;display:flex;align-items:center;
  justify-content:center;flex:none;transition:background var(--t1) ease,transform var(--press-out) var(--ease-out)}
.play:active{transform:scale(.93);transition-duration:0ms}
.play.on{background:var(--khz-lift)}
.wave{display:flex;align-items:center;gap:2.5px;height:20px;flex:1;min-width:0;overflow:hidden}
.wave i{display:block;width:2px;background:rgba(176,140,236,.32);flex:none}
.wave i.lit{background:var(--khz-txt)}

/* ---------- editorial: image first, headline under it, no container ---------- */
.ed{display:block;width:100%;padding-inline:var(--pad);transition:opacity var(--t1) ease}
.ed:active{opacity:.72}
.ed h3{font-family:var(--f-d);font-size:25px;font-weight:700;line-height:1.42;margin:14px 0 0;max-width:17ch}
.ed p{font-family:var(--f-u);font-size:13.5px;line-height:1.75;color:var(--ink-2);margin:8px 0 0;max-width:32ch}
.ed .kick{display:block;margin-top:14px}
.ed.wide{padding-inline:0}
.ed.wide .plate{border-radius:0}
.ed.wide h3,.ed.wide p,.ed.wide .kick{padding-inline:var(--pad)}

.erow-n{font-family:var(--f-u);font-size:12px;font-weight:600;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
/* «من مَلفى» — a consistent two-up grid (2–2–2), collapsing to one card
   per row on narrow screens; never a horizontal scroller. */
.topic-grid{display:grid;grid-template-columns:1fr;gap:12px;padding-inline:var(--pad)}
.topic-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;
  padding:20px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--ground-2);
  text-align:start;position:relative;transition:border-color var(--t1) ease,background var(--t1) ease}
.topic-card:active{background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
.topic-card h4{font-family:var(--f-d);font-size:16.5px;font-weight:700;line-height:1.5;margin:0;flex:1}
.topic-card .ic{position:absolute;bottom:18px;inset-inline-end:18px;color:var(--ink-3)}
@media (min-width:521px){.topic-grid{grid-template-columns:1fr 1fr}}
/* «شارك بإثراء مَلفى» — inviting, not an ad: one restrained accent tint. */
.share-cta{padding:22px;border-radius:var(--r2);text-align:start;
  background:linear-gradient(155deg,color-mix(in srgb,var(--khz) 14%,var(--ground-2)),var(--ground-2));
  border:1px solid color-mix(in srgb,var(--khz-txt) 28%,transparent)}
.share-cta h3{font-family:var(--f-d);font-size:18px;font-weight:700;margin:0}
.share-cta p{font-family:var(--f-u);font-size:13.5px;color:var(--ink-2);line-height:1.75;margin:8px 0 0;max-width:38ch}
.share-cta .btn{margin-top:16px}

/* ---------- reader feature ---------- */
.who{padding-inline:var(--pad)}
.who h3{font-family:var(--f-d);font-size:26px;font-weight:700;line-height:1.4;margin:14px 0 0}
.who p{font-family:var(--f-u);font-size:14px;line-height:1.8;color:var(--ink-2);margin:10px 0 0;max-width:34ch}
.who-books{display:flex;gap:10px;margin-top:18px;align-items:flex-end}

/* ---------- collection ---------- */
.coll{display:flex;gap:18px;align-items:center;width:100%;padding:16px var(--pad);
  transition:background var(--press-out) ease}
.coll:active{transition-duration:0ms;background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
.coll-b{flex:1;min-width:0}
.coll h3{font-family:var(--f-d);font-size:19px;font-weight:700;line-height:1.42;margin:0}

/* ============================================================
   LIBRARY
   ============================================================ */
.stick{position:sticky;top:0;z-index:30;background:var(--chrome-9);backdrop-filter:saturate(160%) blur(22px);
  -webkit-backdrop-filter:saturate(160%) blur(22px)}
.stick::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--rule)}
.stick .thead{position:static;background:none;backdrop-filter:none;padding-bottom:10px}
.segs{position:relative;display:flex;gap:20px;overflow-x:auto;padding:0 var(--pad);scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{position:relative;padding:4px 0 12px;font-family:var(--f-u);font-size:14px;font-weight:500;color:var(--ink-3);
  white-space:nowrap;flex:none;transition:color var(--t1) ease}
.seg.on{color:var(--ink);font-weight:600}
.seg b{font-weight:inherit;opacity:.5;font-size:12px;margin-inline-start:4px}
.seg-ind{position:absolute;left:0;bottom:0;width:1px;height:2px;background:var(--khz-txt);transform-origin:0 50%;
  transform:scaleX(0);will-change:transform;transition:transform 280ms var(--ease-mid)}
.lib-reading-row{display:flex;gap:14px;padding:16px var(--pad);animation:gridIn 260ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 26ms)}
.lib-reading-b{flex:1;min-width:0}
.lib-reading-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--khz-txt);margin-inline-end:6px}
.lib-reading-live{font-family:var(--f-u);font-size:11.5px;font-weight:600;color:var(--khz-txt)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 13px;padding-inline:var(--pad)}
.grid3 .cv{--cw:100%;font-size:1.06px}
.grid3>*{animation:gridIn 260ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 26ms)}
@keyframes gridIn{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
.empty{padding:56px 34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .ic{color:var(--ink-3);opacity:.5}
.empty h3{font-family:var(--f-d);font-size:20px;font-weight:700;margin:0}
.empty p{font-family:var(--f-u);font-size:13px;color:var(--ink-3);margin:0;line-height:1.8;max-width:27ch}

/* ============================================================
   COMMUNITY / PROFILE / ACCOUNT — rows on the ground
   ============================================================ */
.act{display:flex;gap:14px;padding:18px var(--pad);width:100%;align-items:flex-start;
  transition:background var(--press-out) ease}
.act:active{transition-duration:0ms;background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
.face{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden}
.face svg{display:block;width:100%;height:100%}
.act-b{flex:1;min-width:0}
.act-l{font-family:var(--f-u);font-size:13.5px;line-height:1.65;color:var(--ink-3)}
.act-l b{color:var(--ink);font-weight:600}
.act-q{font-family:var(--f-d);font-size:17px;line-height:1.85;color:var(--ink);margin:9px 0 0}
.reader{width:150px;flex:none;display:flex;align-items:center;gap:11px}
.reader .plate{width:52px;height:52px;flex:none}
.reader h4{font-family:var(--f-d);font-size:15.5px;font-weight:700;margin:0;line-height:1.35}
.counts{display:flex;gap:24px;padding-inline:var(--pad)}
.count b{font-family:var(--f-d);font-size:20px;font-weight:700;line-height:1;display:block}
.count span{font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);display:block;margin-top:6px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px var(--pad);
  transition:background var(--press-out) ease}
.row:active{transition-duration:0ms;background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
.row-b{flex:1;min-width:0}
.row-t{font-family:var(--f-u);font-size:15px;font-weight:500;margin:0}
.row .ic.ch{color:var(--ink-3)}

/* ============================================================
   DISCOVER
   ============================================================ */
.search{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:var(--r2);height:46px;
  padding:0 14px;margin-inline:var(--pad);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f-u);font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-inline:var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--rule-2);font-family:var(--f-u);
  font-size:13.5px;font-weight:500;color:var(--ink-2);min-height:40px;display:flex;align-items:center;
  transition:background var(--press-out) ease}
.chip:active{transition-duration:0ms;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.chip.on{background:var(--khz);color:#fff;box-shadow:none}
.authors{display:flex;gap:16px;overflow-x:auto;padding-inline:var(--pad);scrollbar-width:none}
.authors::-webkit-scrollbar{display:none}
.au{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.au .plate{width:68px;height:68px}
.au-n{font-family:var(--f-u);font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.45}

/* ============================================================
   BOOK DETAIL / TIMELINE
   ============================================================ */
.bhero{position:relative;padding:14px var(--pad) 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.bhero .glow{position:absolute;top:-30px;inset-inline:0;height:270px;pointer-events:none;filter:blur(60px);opacity:.42}
.bhero>*{position:relative}
.bhero h1{font-family:var(--f-d);font-size:26px;font-weight:700;line-height:1.42;margin:22px 0 0;max-width:17ch}
.bhero .al{font-family:var(--f-u);font-size:13.5px;color:var(--ink-3);margin:8px 0 0}
.tl{position:relative;padding-inline:var(--pad)}
.tl-line{position:absolute;inset-inline-start:calc(var(--pad) + 3px);top:10px;bottom:14px;width:1px;background:var(--rule)}
.tl-i{position:relative;padding-inline-start:24px;padding-bottom:26px}
.tl-i:last-child{padding-bottom:2px}
.tl-d{position:absolute;inset-inline-start:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ground);
  box-shadow:inset 0 0 0 1.5px var(--rule-2)}
.tl-i.mk .tl-d{background:var(--khz-txt);box-shadow:none}
.tl-date{font-family:var(--f-d);font-size:16px;font-weight:700;line-height:1.5;margin:0}
.tl-q{font-family:var(--f-d);font-size:16.5px;font-weight:400;line-height:1.9;color:var(--ink-2);margin:11px 0 0}
.tl-v{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--khz-txt);font-family:var(--f-u);
  font-size:11.5px;font-weight:500}
.tl-i.fresh{animation:fu 280ms var(--ease-out)}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.facts{display:flex;flex-wrap:wrap;gap:7px 18px;padding-inline:var(--pad)}
.fact{font-family:var(--f-u);font-size:12px;color:var(--ink-3)}
.fact b{font-weight:500;color:var(--ink-2)}

/* ============================================================
   SHEET / COMPLETION / TOAST
   ============================================================ */
.backdrop{position:absolute;inset:0;z-index:50;background:rgba(3,2,5,.66);opacity:0;visibility:hidden;
  transition:opacity var(--t3) ease,visibility 0s linear var(--t3)}
.backdrop.on{opacity:1;visibility:visible;transition-delay:0s}
.backdrop.dragging{transition:none}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:51;background:var(--ground-2);border-radius:var(--r4) var(--r4) 0 0;
  transform:translateY(101%);transition:transform 320ms var(--e);padding:10px 24px 34px;touch-action:none;
  will-change:transform;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.grab{width:44px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 auto 10px;
  transition:background var(--t1) ease}
.sheet.dragging .grab{background:color-mix(in srgb,var(--ink) 34%,transparent)}
.sh-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.v-ask{font-family:var(--f-u);font-size:22px;font-weight:600;line-height:1.5;margin:14px 0 0}
.v-sub{font-family:var(--f-u);font-size:14px;color:var(--ink-3);margin:7px 0 0}
.mic{width:88px;height:88px;border-radius:50%;background:var(--khz);color:#fff;display:flex;align-items:center;
  justify-content:center;margin:24px 0 0;transition:transform var(--press-out) var(--ease-out),box-shadow var(--t2) ease}
.mic:active{transform:scale(.95);transition-duration:0ms}
.mic.rec{box-shadow:0 0 0 10px rgba(83,50,139,.3)}
.v-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:28px;margin-top:20px;width:100%}
.v-wave i{width:2px;height:4px;background:rgba(176,140,236,.3);transition:height 160ms ease}
.v-wave.live i{background:var(--khz-txt);animation:vb 1.05s ease-in-out infinite alternate}
.v-wave.kept i{height:var(--h);background:rgba(176,140,236,.55)}
@keyframes vb{from{height:5px}to{height:var(--h,14px)}}
.v-time{font-family:var(--f-u);font-size:13px;font-weight:500;color:var(--ink-3);margin-top:10px;
  font-variant-numeric:tabular-nums}
.v-txt{font-family:var(--f-d);font-size:16.5px;line-height:1.9;color:var(--ink-2);margin:14px 0 0;min-height:58px;
  max-width:30ch;display:flex;align-items:center;text-align:center}
.v-txt[contenteditable="true"]{outline:none;box-shadow:0 0 0 1px var(--rule-2);border-radius:var(--r1);padding:6px 10px}
.v-txt:empty::before{content:attr(data-placeholder);color:var(--ink-3)}
.pagebox{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;
  padding:12px 0;border-block:1px solid var(--rule)}
.pagebox .lbl{font-family:var(--f-u);font-size:13.5px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--rule-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper .val{font-family:var(--f-u);font-size:15px;font-weight:600;min-width:46px;text-align:center;
  font-variant-numeric:tabular-nums}
.v-act{display:flex;gap:12px;align-items:center;width:100%;margin-top:20px}
.v-act .btn-fill{flex:1}

.done-h{font-family:var(--f-d);font-size:29px;font-weight:700;line-height:1.48;text-align:center;margin:0;
  padding-inline:var(--pad)}
.stats{display:flex;gap:28px;padding:20px var(--pad);border-block:1px solid var(--rule);margin-inline:var(--pad)}
.stat b{font-family:var(--f-d);font-size:25px;font-weight:700;line-height:1;display:block}
.stat span{font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);display:block;margin-top:7px}
.essay p{font-family:var(--f-d);font-size:17px;line-height:2.05;color:var(--ink);margin:0 0 18px;padding-inline:var(--pad)}
.essay p:last-child{margin-bottom:0}

/* ============================================================
   WIDER SCREENS — the same single app, thoughtfully laid out.
   Real mobile (<=520px) already goes edge-to-edge (see the .stage/
   .phone rule near the top). Two more tiers, kept last in the
   cascade so they win over every base component rule they touch:
   a wide-but-still-single-column reading frame for tablet portrait
   / narrow windows, then a persistent side rail once there is real
   desktop width to work with. Nothing here forks the markup,
   screens, router, or data layer — same VIEWS, same click
   delegation, same backend, just different chrome around it.
   ============================================================ */
@media (min-width:521px) and (max-width:1023px){

  .screen{padding-bottom:56px}
  .tabbar{display:none}
  .home-ind{display:none}
  /* bottom sheets become centered dialogs; same slide-up transform, no JS changes */
  .sheet{max-width:480px;margin-inline:auto;border-radius:var(--r4)}
  .backdrop{cursor:pointer}
  /* three-across grids get real breathing room instead of stretching three tiles wide */
  .grid3{grid-template-columns:repeat(4,1fr)}

  /* the side rail only reserves space once a screen actually wants the tab
     bar shown (mount() toggles this the same way it already toggles the
     bar's own opacity) — so welcome/auth/onboarding/pushed screens stay a
     single centered column instead of leaving a blank reserved sidebar. */
  .phone.with-nav{display:grid;grid-template-columns:264px minmax(0,860px) 1fr;align-items:stretch}

function arErrorMessage(error){
  var msg=(error&&error.message)||'';
  if(/invalid login credentials/i.test(msg))return 'البريد أو كلمة المرور غير صحيحة.';
  if(/already registered|already exists/i.test(msg))return 'هذا البريد مسجّل عندنا. جرّب تسجّل دخولك.';
  if(/password should be at least/i.test(msg))return 'كلمة المرور لازم تكون 10 خانات على الأقل.';
  if(/rate limit/i.test(msg))return 'حاولت كثير بسرعة. جرّب بعد شوي.';
  if(/network|fetch/i.test(msg))return 'ما قدرنا نتصل. تأكد من الإنترنت وحاول.';
  return 'صار خطأ. حاول مرة ثانية.';
}

   normal self-row RLS insert policy. A failed login has no session, so it
   can't use RLS — it goes through the narrow public log-failed-signin
   function instead (see admin/index.html + CLAUDE_CODE_HANDOFF.md §16). */
function deviceInfo(){
  var ua=navigator.userAgent||'';
  var platform=/iPhone|iPad|iPod/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Win/.test(ua)?'Windows':'ويب';
  return {device:platform,platform:platform};
}
function logAuthEvent(userId,type){
  var d=deviceInfo();
  return sb.from('auth_events').insert({user_id:userId,event_type:type,status:'success',device:d.device,platform:d.platform})
    .then(function(){},function(){});
}
function logFailedSignin(email){
  fetch('https://ntpwnrsckacwqzvgoysb.supabase.co/functions/v1/log-failed-signin',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:String(email||'').slice(0,254)})
  }).catch(function(){});
}
function touchLastSeen(){
  if(!ME)return;
  sb.from('profiles').update({last_seen_at:new Date().toISOString()}).eq('id',ME.id).then(function(){},function(){});
}

function handleAuthSubmit(btn){
  var emailEl=document.getElementById('authEmail'),passEl=document.getElementById('authPass'),
      nameEl=document.getElementById('authName'),handleEl=document.getElementById('authHandle'),errEl=document.getElementById('authErr');
  var email=emailEl?(emailEl.value||'').trim():'',pass=passEl.value||'',name=nameEl?(nameEl.value||'').trim():'',
      handle=handleEl?(handleEl.value||'').trim().toLowerCase():'';
  errEl.textContent='';
  if(authMode==='reset'){
    if(pass.length<10){errEl.textContent='كلمة المرور لازم تكون 10 خانات على الأقل.';return;}
    btn.disabled=true;btn.textContent='لحظة...';
    sb.auth.updateUser({password:pass}).then(function(res){
      if(res.error){btn.disabled=false;btn.textContent='حفظ كلمة المرور';errEl.textContent=arErrorMessage(res.error);return;}
      authMode='login';replaceRoute('auth');mount('auth','fade');toast('تغيّرت كلمة المرور.');
    });
    return;
  }
  if(!email||!pass){errEl.textContent='عبّي البريد وكلمة المرور.';return;}
  if(authMode==='signup'&&!name){errEl.textContent='عبّي اسمك.';return;}
  if(authMode==='signup'&&!/^[a-z0-9_]{3,24}$/.test(handle)){errEl.textContent='اسم الحساب من 3–24 حرفًا إنجليزيًا أو رقمًا أو شرطة سفلية.';return;}
  if(authMode==='signup'&&pass.length<10){errEl.textContent='كلمة المرور لازم تكون 10 خانات على الأقل.';return;}
  var origLabel=btn.textContent;
  btn.disabled=true;btn.textContent='لحظة...';
  var req=authMode==='login'
    ?sb.auth.signInWithPassword({email:email,password:pass})
    :sb.auth.signUp({email:email,password:pass,options:{data:{name:name,handle:handle,is_discoverable:false}}});
  req.then(function(res){
    if(res.error){
      btn.disabled=false;btn.textContent=origLabel;
      errEl.textContent=arErrorMessage(res.error);
      if(authMode==='login')logFailedSignin(email);
      return;
    }
    if(authMode==='signup'&&(!res.data||!res.data.session)){
      PENDING_EMAIL=email;
      btn.disabled=false;btn.textContent=origLabel;
      document.getElementById('authBody').innerHTML=authWaitingHTML(email);
      return;
    }
    ME={id:res.data.user.id,email:res.data.user.email};
    IS_NEW_SIGNUP=(authMode==='signup');
    logAuthEvent(ME.id,IS_NEW_SIGNUP?'register':'sign_in');
    touchLastSeen();
    loadAll().then(function(){
      if(IS_NEW_SIGNUP)startOnboarding();
      else{STATE.tab='home';renderTabs();replaceRoute('home');mount('home','fade');}
    });
  });
}
function handleForgotPassword(){
  var emailEl=document.getElementById('authEmail'),errEl=document.getElementById('authErr');
  var email=(emailEl&&emailEl.value||'').trim();
  if(!email){errEl.textContent='اكتب بريدك أول.';return;}
  sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'#reset-password'}).then(function(){
    toast('إذا البريد مسجّل، وصلك رابط تغيير كلمة المرور.');
  });
}
function resendVerification(){
  if(!PENDING_EMAIL){toast('ارجع واكتب بريدك مرة ثانية.');return;}
  sb.auth.resend({type:'signup',email:PENDING_EMAIL}).then(function(){
    toast('أرسلنا رابطًا جديدًا إذا كان الحساب ينتظر التفعيل.');
  });
}

/* ============================================================
   READING SESSION — local live state + private synced history
   ============================================================ */
function readingStorageKey(){return 'malfa_reading_active_'+(ME?ME.id:'signed-out');}
function readingQueueKey(){return 'malfa_reading_queue_'+(ME?ME.id:'signed-out');}
function localDay(value){var d=new Date(value);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function readingElapsedSeconds(a,nowMs){
  if(!a)return 0;var sec=Math.max(0,Number(a.accumulatedSec)||0);
  if(a.status==='running')sec+=Math.max(0,Math.floor(((nowMs||Date.now())-(a.lastResumedAt||nowMs||Date.now()))/1000));
  return sec;
}
function readingMetrics(pageStart,pageEnd,durationSec){
  var pages=Math.max(0,(Number(pageEnd)||0)-(Number(pageStart)||0)),sec=Math.max(0,Number(durationSec)||0);
  return {pages:pages,speed:sec>0?Math.round(pages*360000/sec)/100:0};
}
function pauseReadingState(a,nowMs,reason){
  if(!a||a.status!=='running')return a;
  a.accumulatedSec=readingElapsedSeconds(a,nowMs);a.status='paused';a.pausedAt=nowMs;
  a.pauseReason=reason||'manual';a.pauseCount=(a.pauseCount||0)+1;a.lastTickAt=nowMs;return a;

function restoreReadingState(a,nowMs){
  if(!a||a.status!=='running')return a;

  a.accumulatedSec=readingElapsedSeconds(a,safeEnd);a.status='paused';a.pausedAt=nowMs||Date.now();
  a.pauseReason='crash';a.pauseCount=(a.pauseCount||0)+1;a.recovered=true;return a;
}

    if((s.book_id||s.user_book_id)!==bookId||!(s.duration_sec>0))return;

/* Real calendar month (not a rolling N-day strip): weekday-aligned so

function readingCalendarHTML(){
  var now=new Date();

  var year=now.getFullYear(),month=now.getMonth();

  var streaks=readingStreaks();

  var WEEKDAYS=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
  var cells='';
  for(var i=0;i<startWeekday;i++)cells+='<div class="rs-day empty" aria-hidden="true"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateObj=new Date(year,month,d),key=localDay(dateObj),day=map[key];
    var isToday=key===todayKey,isRead=!!(day&&day.sec>0),goalHit=!!(isRead&&day.goal&&day.sec>=day.goal*60);
    var isFuture=dateObj.getTime()>todayMid.getTime(),isMissed=!isToday&&!isRead&&!isFuture;

      +'<span class="rs-streak-label">'+(streaks.current===1?'يوم قراءة متواصل':'أيام قراءة متواصلة')+'</span></div>'
    :'<div class="rs-streak rs-streak-empty"><span class="rs-streak-label">ابدأ اليوم عشان تبدأ سلسلتك</span></div>';
  return '<div class="rs-cal-head"><span class="rs-cal-month">'+AR_MONTHS[month]+' '+year+'</span>'+streakBlock+'</div>'
    +'<div class="s14"></div>'
    +'<div class="rs-day-status">'+(readToday?'<span class="rs-status-pill on">قرأت اليوم'+ic('check',13)+'</span>':'<span class="rs-status-pill">ما قرأت اليوم بعد</span>')
    +(goal?'<span class="meta tnum">'+Math.min(weekDays,goal)+' من '+goal+' أيام هذا الأسبوع</span>':'<span class="meta tnum">'+weekDays+' أيام هذا الأسبوع</span>')+'</div>'
    +'<div class="s12"></div>'
    +'<div class="rs-cal-weekdays">'+WEEKDAYS.map(function(w){return '<span class="rs-cal-wd">'+w+'</span>';}).join('')+'</div>'
    +'<div class="s8"></div><div class="rs-calendar">'+cells+'</div>';
}

/* Merges journey_entries (voice/written notes) with reading_sessions for
   the same book into one chronological timeline — an additive read model,
   not a duplicate copy: each source row is rendered once, from its own
   table, joined only by book key + timestamp for display order. */
function mergedJourneyView(bookId){
  var items=myJourneyView(bookId).map(function(e){return {type:'entry',ts:e.ts,e:e};});
  MY_READING_SESSIONS.filter(function(s){return (s.book_id||s.user_book_id)===bookId;}).forEach(function(s){
    items.push({type:'session',ts:new Date(s.started_at).getTime(),s:s});
  });
  return items.sort(function(a,b){return b.ts-a.ts;});
}
function journeySessionRowHTML(s){
  return '<div class="tl-i"><span class="tl-d"></span><p class="tl-date">'+esc(fmtDate(s.started_at))+'</p>'
    +'<p class="meta tnum" style="margin-top:4px">جلسة قراءة · '+fmtTotalDur(s.duration_sec)+(s.pages_read?' · '+s.pages_read+' صفحة':'')+'</p>'
    +(s.note?'<p class="tl-q">'+esc(s.note)+'</p>':'')
    +'<span class="tl-v" style="gap:12px"><button class="plain" data-readingedit="'+s.id+'" aria-label="تعديل الجلسة">'+ic('pencil',15)+' تعديل</button>'
    +'<button class="plain" data-readingdelete="'+s.id+'" aria-label="حذف الجلسة">'+ic('x',15)+' حذف</button></span></div>';
}
function journeyHTML(){
  return mergedJourneyView(STATE.book).map(function(it,i){
    if(it.type==='session')return journeySessionRowHTML(it.s);
    var e=it.e;
    return '<div class="tl-i'+(e.start||i===0?' mk':'')+(e.fresh?' fresh':'')+'"><span class="tl-d"></span>'
      +'<p class="tl-date">'+esc(e.d)+'</p>'

/* A spring animates from the CURRENT on-screen value and accepts the finger's
   release velocity, so there is no seam between dragging and animating. */
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function springTo(from,to,v0,opts,onFrame,onDone){
  var response=(opts&&opts.response)||0.34, bounce=(opts&&opts.bounce)||0;
  if(REDUCE){response=0.16;bounce=0;}
  var w=2*Math.PI/response, k=w*w, c=2*(1-bounce)*w;
  var x=from,v=v0||0,last=null,raf;
  function step(t){
    if(last===null)last=t;
    var dt=Math.min((t-last)/1000,1/30);last=t;
    v+=(-k*(x-to)-c*v)*dt; x+=v*dt;
    if(Math.abs(x-to)<0.5&&Math.abs(v)<10){onFrame(to);if(onDone)onDone();return;}
    onFrame(x);raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  return function(){cancelAnimationFrame(raf);};
}
/* Apple's momentum projection — where the flick is going, not where it stopped */
function project(v,d){d=d||0.998;return (v/1000)*d/(1-d);}
/* progressive resistance past the top edge instead of a hard stop */
function rubber(o,dim,c){c=c||0.55;return (o*dim*c)/(dim+c*Math.abs(o));}

        png=b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47,
        webp=b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50;
    if(!jpeg&&!png&&!webp)throw new Error('cover_type');

  }).then(function(img){
    if(!img.width||!img.height||img.width>8000||img.height>8000){img.close();throw new Error('cover_dimensions');}
    var scale=Math.min(1,1800/Math.max(img.width,img.height)),canvas=document.createElement('canvas');

  var b=myBookView(bookId);if(!b)return;
  var custom=isCustomBook(bookId);
  var origText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='لحظة...';}
  edgeFn('summarize-journey',{book_id:custom?null:bookId,user_book_id:custom?bookId:null})
    .then(function(res){
      if(btn){btn.disabled=false;btn.textContent=origText;}
      if(!res.ok){
        console.error('Menara generation failed',res.status,JSON.stringify(res.body||{}));
        if(res.body&&res.body.error==='not_configured')toast('منارة تحتاج إعداد مفتاح الذكاء الاصطناعي أول.');
        else if(res.body&&res.body.error==='no_entries')toast('ما فيه محطات كافية لتوليد منارة.');
        else if(res.body&&res.body.error==='quota_exhausted')toast('خدمة منارة مزدحمة الآن. جرّب بعد دقيقة.');
        else if(res.body&&res.body.error==='plan_required'){
          var body2=document.getElementById('bookTabBody');
          if(body2&&bookTab==='menara')body2.innerHTML=menaraHTML(bookId);
          openSheet('upgrade',{feature:'menara'});
        }
        else toast('صار خطأ بتوليد منارتك. حاول مرة ثانية.');
        return;
      }
      MY_SUMMARIES[bookId]=res.body;
      var body=document.getElementById('bookTabBody');
      if(body&&bookTab==='menara')body.innerHTML=menaraHTML(bookId);
    });
}

function closeSheet(){
  if(recTimer){clearInterval(recTimer);recTimer=null;}

  if(recognizing&&recognition){recognition.onend=null;recognition.stop();recognizing=false;}

  }

  mediaRecorder=null;recordedBlob=null;audioChunks=[];recordState='idle';

  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  backdrop.classList.remove('on');sheet.classList.remove('on');

/* ---------- the sheet is grabbable: 1:1 tracking, rubber-band, velocity handoff ---------- */
var sheetY=0,cancelSpring=null,drag=null;
function setSheetY(y){
  sheetY=y;
  sheet.style.transform=y?'translateY('+y+'px)':'';
  var h=sheet.offsetHeight||1;
  backdrop.style.opacity=String(Math.max(0,1-(Math.max(0,y)/h)*1.1));
}
sheet.addEventListener('pointerdown',function(e){
  if(!sheet.classList.contains('on'))return;
  if(e.target.closest('button,input,textarea,a,[contenteditable="true"]'))return;
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  drag={id:e.pointerId,y0:e.clientY,base:sheetY,moved:false,hist:[{y:e.clientY,t:e.timeStamp}]};
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0;
  if(!drag.moved){ if(Math.abs(dy)<8)return;
    drag.moved=true;sheet.classList.add('dragging');backdrop.classList.add('dragging'); }
  var y=drag.base+dy, h=sheet.offsetHeight||1;
  if(y<0)y=-rubber(-y,h);
  setSheetY(y);
  drag.hist.push({y:e.clientY,t:e.timeStamp});
  if(drag.hist.length>5)drag.hist.shift();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var moved=drag.moved,hist=drag.hist;drag=null;
  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  if(!moved)return;
  var a=hist[0],b=hist[hist.length-1];
  var vel=(b.y-a.y)/Math.max(1,b.t-a.t)*1000;
  var h=sheet.offsetHeight||1;
  if(sheetY+project(vel)>h*0.32||vel>620){
    cancelSpring=springTo(sheetY,h,vel,{response:0.3},setSheetY,function(){
      cancelSpring=null;closeSheet();
    });
  }else{
    /* bounce only because a flick preceded it */
    cancelSpring=springTo(sheetY,0,vel,{response:0.34,bounce:0.12},setSheetY,function(){
      sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
    });
  }
}
sheet.addEventListener('pointerup',endDrag);
sheet.addEventListener('pointercancel',endDrag);
sheet.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!SHEET_CTX.onboard)closeSheet();return;}
  if(e.key!=='Tab')return;
  var focusable=Array.prototype.filter.call(sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),[contenteditable="true"]'),function(x){return x.offsetParent!==null;});
  if(!focusable.length)return;var first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

}

      var target=INITIAL_ROUTE||{view:'home',tab:'home'};

      STATE.tab=target.tab||'home';STATE.book=target.book||STATE.book;renderTabs();replaceRoute(target.view);mount(target.view,'fade');

}
/* the router already restores scroll per-screen itself (navSnapshot's
   scroll field, replayed in restoreRoute) — the browser's own native
   scroll restoration on back/forward/reload fights with that and can
   snap a freshly mounted screen to a stale offset, so hand it off. */

});

})();
