*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050406;font-family:var(--f-u);color:var(--ink)}

.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:36px 16px;
  background:radial-gradient(120% 80% at 50% 0%,#16141c 0%,#050406 60%)}
.phone{position:relative;width:393px;height:852px;background:var(--ground);border-radius:46px;overflow:hidden;direction:rtl;
  box-shadow:0 0 0 10px #1e1c22,0 0 0 11px rgba(255,255,255,.06),0 44px 100px -30px rgba(0,0,0,.9)}
@media (max-width:520px){ .stage{padding:0} .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none} }

.statusbar{position:absolute;top:0;inset-inline:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 8px;z-index:60;pointer-events:none;direction:ltr;color:#fff}
.sb-time{font-size:15px;font-weight:600;letter-spacing:.2px}
.sb-right{display:flex;align-items:center;gap:5px}

.app{position:absolute;top:52px;inset-inline:0;bottom:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--ground);
  opacity:0;visibility:hidden;padding-bottom:112px;scrollbar-width:none;
  transition:opacity 240ms ease,transform 240ms var(--ease-out),visibility 0s linear 240ms}
.screen::-webkit-scrollbar{display:none}
.screen.instant{transition:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.screen.ent-push{transform:translateX(-26px)}
.screen.ent-pop{transform:translateX(26px)}
.screen.exit-push{opacity:0;transform:translateX(18px);visibility:visible}
.screen.exit-pop{opacity:0;transform:translateX(-18px);visibility:visible}

/* ---------- primitives: rules and air, not boxes ---------- */
.pad{padding-inline:var(--pad)}
.hr{height:1px;background:var(--rule);margin-inline:var(--pad)}
.hrf{height:1px;background:var(--rule)}
.s8{height:8px}.s10{height:10px}.s12{height:12px}.s14{height:14px}.s16{height:16px}
.s20{height:20px}.s24{height:24px}.s28{height:28px}.s32{height:32px}.s40{height:40px}.s48{height:48px}
button{font-family:var(--f-u);cursor:pointer;border:0;background:none;color:inherit;text-align:start;padding:0}

.kick{font-family:var(--f-u);font-size:11.5px;font-weight:600;color:var(--ink-3)}

  background:var(--grain);background-size:34% auto;opacity:.16;mix-blend-mode:overlay}

  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cv-pub{font-family:var(--f-u);font-size:5.4em;font-weight:500;opacity:.4;margin-top:3em}

/* four layouts: paper at the foot, paper at the head, reversed on a scrim, or all type */
.cv.l-foot .cv-plate{inset-block-end:0;background:var(--p)}

.mic:active{transform:scale(.95);transition-duration:0ms}
.mic.rec{box-shadow:0 0 0 10px rgba(83,50,139,.3)}
.v-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:28px;margin-top:20px;width:100%}
.v-wave i{width:2px;height:4px;background:rgba(176,140,236,.3);transition:height 160ms ease}
.v-wave.live i{background:var(--khz-txt);animation:vb 1.05s ease-in-out infinite alternate}
.v-wave.kept i{height:var(--h);background:rgba(176,140,236,.55)}
@keyframes vb{from{height:5px}to{height:var(--h,14px)}}
.v-time{font-family:var(--f-u);font-size:13px;font-weight:500;color:var(--ink-3);margin-top:10px;
  font-variant-numeric:tabular-nums}
.v-txt{font-family:var(--f-d);font-size:16.5px;line-height:1.9;color:var(--ink-2);margin:14px 0 0;min-height:58px;
  max-width:30ch;display:flex;align-items:center}
.pagebox{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;
  padding:12px 0;border-block:1px solid var(--rule)}
.pagebox .lbl{font-family:var(--f-u);font-size:13.5px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--rule-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper .val{font-family:var(--f-u);font-size:15px;font-weight:600;min-width:46px;text-align:center;
  font-variant-numeric:tabular-nums}
.v-act{display:flex;gap:12px;align-items:center;width:100%;margin-top:20px}
.v-act .btn-fill{flex:1}

.done-h{font-family:var(--f-d);font-size:29px;font-weight:700;line-height:1.48;text-align:center;margin:0;
  padding-inline:var(--pad)}
.stats{display:flex;gap:28px;padding:20px var(--pad);border-block:1px solid var(--rule);margin-inline:var(--pad)}
.stat b{font-family:var(--f-d);font-size:25px;font-weight:700;line-height:1;display:block}
.stat span{font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);display:block;margin-top:7px}
.essay p{font-family:var(--f-d);font-size:17px;line-height:2.05;color:var(--ink);margin:0 0 18px;padding-inline:var(--pad)}
.essay p:last-child{margin-bottom:0}
.done-act{display:flex;gap:10px;align-items:center;padding-inline:var(--pad)}
.done-act .btn-fill{flex:1}

.track{display:flex;align-items:center;gap:12px;padding-inline:var(--pad)}
.track .face{width:32px;height:32px}
.track-b{flex:1;min-width:0}

.toast{position:absolute;bottom:46px;inset-inline:0;z-index:60;display:flex;justify-content:center;pointer-events:none;
  transform:translateY(-58px);transition:transform var(--t2) var(--ease-out)}
.toast.low{transform:none}
.toast div{background:#EFEAF5;color:#131218;font-family:var(--f-u);font-size:13.5px;font-weight:600;padding:11px 18px;
  border-radius:var(--r1);opacity:0;transform:translateY(8px);
  transition:opacity var(--t2) ease,transform var(--t2) var(--ease-out)}
.toast.on div{opacity:1;transform:none}

/* ============================================================
   OPENING — welcome → login/sign-up. One quiet reveal, then done.
   ============================================================ */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 44px}
.w-mark{font-family:var(--f-d);font-size:42px;font-weight:700;color:var(--ink);margin:0;
  opacity:0;transform:translateY(5px) scale(.98);animation:wIn 1000ms var(--ease-out) 160ms forwards}
.w-tag{font-family:var(--f-u);font-size:15px;font-weight:500;color:var(--ink-2);margin:16px 0 0;
  opacity:0;transform:translateY(5px);animation:wIn 900ms var(--ease-out) 820ms forwards}
.w-love{position:absolute;bottom:56px;inset-inline:0;text-align:center;
  font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);opacity:0;animation:wFade 1000ms ease 1650ms forwards}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes wFade{to{opacity:.7}}

.auth-h{font-family:var(--f-d);font-size:27px;font-weight:700;line-height:1.44;margin:14px 0 0}
.field{margin-top:16px}
.field label{display:block;font-family:var(--f-u);font-size:12.5px;font-weight:500;color:var(--ink-3);margin-bottom:8px}
.field input{width:100%;height:50px;border-radius:var(--r2);background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px var(--rule-2);padding:0 16px;font-family:var(--f-u);font-size:15px;color:var(--ink);
  border:0;outline:none;transition:box-shadow var(--t1) ease}
.field input::placeholder{color:var(--ink-3)}
.field input:focus{box-shadow:inset 0 0 0 1.5px var(--khz-txt)}

@media (prefers-reduced-motion:reduce){
  :root{--t1:90ms;--t2:110ms;--t3:150ms;--press-out:120ms}
  .screen.ent-push,.screen.ent-pop,.screen.exit-push,.screen.exit-pop{transform:none!important}
  .toast,.toast.low{transform:none!important}
  .grid3>*,.tl-i.fresh{animation:none!important}
  .v-wave.live i{animation:none!important;height:10px!important}
  .seg-ind{transition-duration:90ms!important}
  .w-mark,.w-tag,.w-love{animation:none!important;opacity:1!important;transform:none!important}
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function w(v){return typeof v==='number'?v+'px':v;}
function stock(i){return ST[i%ST.length];}

function cover(id,cw,mini){
  var b=B[id],st=stock(b.st);
  var art=b.sc?'<span class="cv-art">'+scene(b.sc,st)+'</span>':'';
  var scrim=(b.l==='full')?'<span class="cv-scrim"></span>':'';
  var foot='<span class="cv-a" style="display:block">'+esc(b.a)+'</span>'
    +(b.l!=='full'&&b.pub?'<span class="cv-pub" style="display:block">'+esc(b.pub)+'</span>':'');
  var plate='<span class="cv-plate">'
    +'<span class="cv-t" style="display:block">'+esc(b.t)+'</span>'
    +(b.l==='type'?'<span class="cv-foot"><span class="cv-rule"></span>'+foot+'</span>':foot)
    +'</span>';
  return '<div class="cv l-'+b.l+(mini?' mini':'')+'" style="--cw:'+w(cw)+';--p:'+st.p+';--a:'+st.a+';--b:'+st.b+'">'
    +art+scrim+plate+'</div>';
}
function bk(id,cw){return '<div data-book="'+id+'" style="flex:none">'+cover(id,cw)+'</div>';}
function stack(ids,cw,off){
  cw=cw||46;off=off||17;
  return '<div class="stack" style="width:'+(cw+off*2)+'px;height:'+(cw*1.5)+'px">'
    +ids.map(function(id,i){return '<div style="position:absolute;top:0;inset-inline-start:'+(i*off)+'px;z-index:'+(9-i)+'">'
      +cover(id,cw)+'</div>';}).join('')+'</div>';
}
function pct(b){return Math.round(b.page/b.pages*100);}
function edPlate(ids,st){
  return '<span class="plate r16 shelf" style="--p:'+st.p+'">'
    +ids.map(function(id,i){return '<span class="sh-c" style="--i:'+i+'">'+cover(id,96)+'</span>';}).join('')
    +'</span>';
}
function plate(sc,st,cls){cls=cls||'r16';
  return '<span class="plate '+cls+'" style="--p:'+st.p+'">'+scene(sc,st,cls==='sq'?'':'wide')+'</span>';}
function face(pid){var p=PMAP[pid];return '<span class="face">'+mono(p.n,stock(p.st))+'</span>';}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}
function waveBars(n,lit){
  var h=[7,12,16,9,18,13,6,15,11,17,8,14,10,16,7,12,18,9,13,6,15,11,8,17,12,7,14,10,16,9];
  var s='';for(var i=0;i<n;i++){s+='<i class="'+(i<lit?'lit':'')+'" style="height:'+h[i%h.length]+'px"></i>';}
  return s;
}
function sec(title,link,toast){
  return '<div class="sec"><h2 class="h2">'+esc(title)+'</h2>'
    +(link?'<button class="lnk" data-toast="'+esc(toast||title+' — قريبًا')+'">'+esc(link)+ic('arrow',15)+'</button>':'')+'</div>';
}

/* ============================================================
   ROUTER
   ============================================================ */
var TABS=[
 {k:'home',i:'home',l:'الرئيسية'},
 {k:'library',i:'books',l:'مكتبتي'},
 {k:'community',i:'malfa',l:'مَلفى',c:1},
 {k:'discover',i:'search',l:'اكتشف'},
 {k:'account',i:'person',l:'حسابي'}
];
var VIEWS={home:homeHTML,library:libraryHTML,community:communityHTML,discover:discoverHTML,
  account:accountHTML,book:bookHTML,profile:profileHTML,done:doneHTML,friend:friendHTML,
  welcome:welcomeHTML,auth:authHTML};
var PUSHED={book:1,profile:1,done:1,friend:1,welcome:1,auth:1};

var app=document.getElementById('app'),tabbar=document.getElementById('tabbar'),
    sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop'),
    toastEl=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg'),current=null,toastT;

function renderTabs(){
  tabbar.innerHTML=TABS.map(function(t){
    return '<button class="tab'+(t.c?' center':'')+(t.k===STATE.tab?' on':'')+'" data-tab="'+t.k+'">'
      +ic(t.i,24)+'<span>'+t.l+'</span></button>';
  }).join('');
}
function mount(name,mode){
  var old=app.querySelector('.screen.on');
  var el=document.createElement('section');
  el.className='screen'+(mode?' ent-'+mode:' instant');
  el.dataset.name=name;
  el.innerHTML=VIEWS[name]();
  app.appendChild(el);
  el.addEventListener('scroll',function(){el.classList.toggle('scrolled',el.scrollTop>6);},{passive:true});
  if(!mode){
    el.classList.add('on');
    if(old&&old.parentNode)old.parentNode.removeChild(old);
  }else{
    requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('on');});});
    if(old){
      old.classList.remove('on','ent-push','ent-pop','instant');old.classList.add('exit-'+mode);
      setTimeout(function(){if(old.parentNode)old.parentNode.removeChild(old);},260);
    }
  }
  syncSegInd(el);
  current=el;
  var hide=!!PUSHED[name];
  tabbar.style.transition='opacity 190ms ease';
  tabbar.style.opacity=hide?'0':'1';
  tabbar.style.pointerEvents=hide?'none':'auto';
  toastEl.classList.toggle('low',hide);
  return el;
}
function goTab(k){
  if(STATE.tab===k&&current&&current.dataset.name===k){current.scrollTo({top:0,behavior:'smooth'});return;}
  STATE.tab=k;STATE.stack=[];renderTabs();mount(k);
}
function push(n){STATE.stack.push(STATE.tab);mount(n,'push');}
function back(){STATE.stack.pop();mount(STATE.tab,'pop');}
function toast(m){toastMsg.textContent=m;toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},1900);}

/* ---------- motion primitives ---------- */
/* A spring animates from the CURRENT on-screen value and accepts the finger's
   release velocity, so there is no seam between dragging and animating. */
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function springTo(from,to,v0,opts,onFrame,onDone){
  var response=(opts&&opts.response)||0.34, bounce=(opts&&opts.bounce)||0;
  if(REDUCE){response=0.16;bounce=0;}
  var w=2*Math.PI/response, k=w*w, c=2*(1-bounce)*w;
  var x=from,v=v0||0,last=null,raf;
  function step(t){
    if(last===null)last=t;
    var dt=Math.min((t-last)/1000,1/30);last=t;
    v+=(-k*(x-to)-c*v)*dt; x+=v*dt;
    if(Math.abs(x-to)<0.5&&Math.abs(v)<10){onFrame(to);if(onDone)onDone();return;}
    onFrame(x);raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  return function(){cancelAnimationFrame(raf);};
}
/* Apple's momentum projection — where the flick is going, not where it stopped */
function project(v,d){d=d||0.998;return (v/1000)*d/(1-d);}
/* progressive resistance past the top edge instead of a hard stop */
function rubber(o,dim,c){c=c||0.55;return (o*dim*c)/(dim+c*Math.abs(o));}

/* ---------- voice sheet ---------- */
var recTimer=null,recSecs=0;
var LINES=['اللي علق معي إن الحارة نفسها صارت شخصية، مو مجرد مكان.',
 'حسّيت إن الكاتبة تكتب عن الطواف كأنه ذاكرة، مو مكان.',
 'وقفت عند جملة وقريتها ثلاث مرات، وما عرفت ليش.'];
function openSheet(){
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
  sheet.innerHTML=sheetHTML();
  backdrop.classList.add('on');sheet.classList.add('on');
  recSecs=0;
  var mic=document.getElementById('mic'),wave=document.getElementById('vWave'),
      time=document.getElementById('vTime'),txt=document.getElementById('vTxt'),
      save=document.getElementById('vSave'),pv=document.getElementById('pgVal');
  mic.addEventListener('click',function(){
    if(recTimer){
      clearInterval(recTimer);recTimer=null;
      mic.classList.remove('rec');wave.classList.remove('live');wave.classList.add('kept');
      mic.innerHTML=ic('mic',34);
      save.disabled=false;
      txt.textContent='«'+LINES[Math.floor(Math.random()*LINES.length)]+'»';
    }else{
      recSecs=0;txt.textContent='';
      mic.classList.add('rec');wave.classList.add('live');wave.classList.remove('kept');
      mic.innerHTML=ic('pause',34);time.textContent='0:00';
      recTimer=setInterval(function(){
        recSecs++;time.textContent='0:'+(recSecs<10?'0':'')+recSecs;
        if(recSecs>=59){mic.click();}
      },1000);
    }
  });
  sheet.addEventListener('click',function(e){
    var s=e.target.closest('[data-step]');
    if(s){STATE.page=Math.max(1,Math.min(B[STATE.book].pages,STATE.page+(+s.dataset.step)*4));pv.textContent=STATE.page;}
  });
  save.addEventListener('click',function(){
    var line=(txt.textContent||'').replace(/^«|»$/g,'');
    var from=B[STATE.book].page;
    closeSheet();
    B[STATE.book].page=Math.max(from,STATE.page);
    JOURNEY.unshift({d:'اليوم',m:(10+recSecs)+' دقيقة · ص '+from+'–'+B[STATE.book].page,q:line,v:true,
      dur:'0:'+(recSecs<10?'0':'')+recSecs,fresh:true});
    setTimeout(function(){
      if(current&&current.dataset.name==='book'){
        var tl=document.getElementById('timeline');
        if(tl)tl.innerHTML='<div class="tl-line"></div>'+journeyHTML();
      }
      JOURNEY[0].fresh=false;
      toast('انحفظت في رحلتك.');
    },250);
  });
}
function closeSheet(){
  if(recTimer){clearInterval(recTimer);recTimer=null;}
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  backdrop.classList.remove('on');sheet.classList.remove('on');
}

/* ---------- the sheet is grabbable: 1:1 tracking, rubber-band, velocity handoff ---------- */
var sheetY=0,cancelSpring=null,drag=null;
function setSheetY(y){
  sheetY=y;
  sheet.style.transform=y?'translateY('+y+'px)':'';
  var h=sheet.offsetHeight||1;
  backdrop.style.opacity=String(Math.max(0,1-(Math.max(0,y)/h)*1.1));
}
sheet.addEventListener('pointerdown',function(e){
  if(!sheet.classList.contains('on'))return;
  if(e.target.closest('button,input,a'))return;
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  drag={id:e.pointerId,y0:e.clientY,base:sheetY,moved:false,hist:[{y:e.clientY,t:e.timeStamp}]};
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0;
  if(!drag.moved){ if(Math.abs(dy)<8)return;
    drag.moved=true;sheet.classList.add('dragging');backdrop.classList.add('dragging'); }
  var y=drag.base+dy, h=sheet.offsetHeight||1;
  if(y<0)y=-rubber(-y,h);
  setSheetY(y);
  drag.hist.push({y:e.clientY,t:e.timeStamp});
  if(drag.hist.length>5)drag.hist.shift();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var moved=drag.moved,hist=drag.hist;drag=null;
  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  if(!moved)return;
  var a=hist[0],b=hist[hist.length-1];
  var vel=(b.y-a.y)/Math.max(1,b.t-a.t)*1000;
  var h=sheet.offsetHeight||1;
  if(sheetY+project(vel)>h*0.32||vel>620){
    cancelSpring=springTo(sheetY,h,vel,{response:0.3},setSheetY,function(){
      if(recTimer){clearInterval(recTimer);recTimer=null;}
      sheet.style.transition='none';
      sheet.classList.remove('on');backdrop.classList.remove('on');
      backdrop.style.opacity='';
      requestAnimationFrame(function(){
        sheet.style.transform='';sheetY=0;
        requestAnimationFrame(function(){sheet.style.transition='';});
      });
    });
  }else{
    /* bounce only because a flick preceded it */
    cancelSpring=springTo(sheetY,0,vel,{response:0.34,bounce:0.12},setSheetY,function(){
      sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
    });
  }
}
sheet.addEventListener('pointerup',endDrag);
sheet.addEventListener('pointercancel',endDrag);

/* ---------- delegated interactions ---------- */
var playT=null,playBtn=null;
function stopPlay(){
  if(playT){clearInterval(playT);playT=null;}
  if(playBtn){
    playBtn.classList.remove('on');playBtn.innerHTML=ic('play',15);
    var wv=playBtn.parentNode.querySelector('.wave');
    if(wv)Array.prototype.forEach.call(wv.children,function(c){c.classList.remove('lit');});
    playBtn=null;
  }
}
document.getElementById('phone').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-closesheet]'))){closeSheet();return;}
  if(e.target===backdrop){closeSheet();return;}
  if((t=e.target.closest('[data-sheet]'))){STATE.page=B[STATE.book].page;openSheet();return;}
  if((t=e.target.closest('[data-back]'))){stopPlay();back();return;}
  if((t=e.target.closest('[data-tab]'))){stopPlay();goTab(t.dataset.tab);return;}
  if((t=e.target.closest('[data-open]'))){
    var o=t.dataset.open;stopPlay();
    if(o==='book')push('book');
    else if(o==='done')push('done');
    else if(o==='friend')push('friend');
    else if(o==='profile'){STATE.person='noura';push('profile');}
    return;
  }
  if((t=e.target.closest('[data-person]'))){STATE.person=t.dataset.person;stopPlay();push('profile');return;}
  if((t=e.target.closest('[data-book]'))){STATE.book=t.dataset.book;stopPlay();push('book');return;}
  if((t=e.target.closest('[data-seg]'))){
    if(t.dataset.seg===libSeg)return;
    libSeg=t.dataset.seg;
    Array.prototype.forEach.call(current.querySelectorAll('.seg'),function(s){s.classList.toggle('on',s.dataset.seg===libSeg);});
    syncSegInd(current);
    document.getElementById('libBody').innerHTML=libBody();
    return;
  }
  if((t=e.target.closest('[data-play]'))){
    var btn=t,wv=btn.parentNode.querySelector('.wave');
    if(playBtn===btn){stopPlay();return;}
    stopPlay();
    playBtn=btn;btn.classList.add('on');btn.innerHTML=ic('pause',15);
    var i=0,bars=wv.children;
    playT=setInterval(function(){
      if(i>=bars.length){stopPlay();return;}
      bars[i].classList.add('lit');i++;
    },110);
    return;
  }
  if((t=e.target.closest('[data-skip]'))){enterAuth();return;}
  if((t=e.target.closest('[data-authtoggle]'))){
    authMode=authMode==='login'?'signup':'login';
    document.getElementById('authBody').innerHTML=authBodyHTML();
    return;
  }
  if((t=e.target.closest('[data-enter]'))){enterApp();return;}
  if((t=e.target.closest('[data-toast]'))){toast(t.dataset.toast);return;}
});

/* ---------- font verification: real width comparison, not fonts.check ---------- */
if(document.fonts&&document.fonts.ready){
  var FAMS=['Alyamama','Thmanyah Sans','Noto Naskh Arabic','IBM Plex Sans Arabic'];
  document.fonts.ready.then(function(){
    return Promise.all(FAMS.map(function(f){
      return document.fonts.load('700 64px "'+f+'"').catch(function(){return [];});
    }));
  }).then(function(){
    var probe=document.createElement('span');
    probe.style.cssText='position:absolute;left:-9999px;top:0;font-size:64px;font-weight:700;white-space:nowrap';
    probe.textContent='وش تقرأ اليوم؟';
    document.body.appendChild(probe);
    function wid(f){probe.style.fontFamily=f;return probe.getBoundingClientRect().width;}
    function has(f){
      return ['monospace','serif','sans-serif'].some(function(g){
        return Math.abs(wid('"'+f+'",'+g)-wid('"__malfa_none__",'+g))>0.5;
      });
    }
    var r=FAMS.map(function(f){return f+': '+(has(f)?'active':'not available');});
    probe.remove();
    console.log('[MALFA fonts] '+r.join(' | '));
  });
}

/* ---------- opening: welcome auto-advances to login/sign-up, then app ---------- */
var bootTimer=null;
function enterAuth(){
  if(bootTimer){clearTimeout(bootTimer);bootTimer=null;}
  if(current&&current.dataset.name==='welcome')mount('auth','fade');
}
function enterApp(){
  STATE.tab='home';renderTabs();mount('home','fade');
}
mount('welcome');
bootTimer=setTimeout(enterAuth,REDUCE?700:2600);
})();
