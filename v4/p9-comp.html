/* ---------- theme: light / dark / system ----------
   :root above holds the dark values (the app's default). An explicit
   data-theme="light" always wins; with no explicit choice, the system's
   prefers-color-scheme decides ("system" mode). data-theme="dark" just
   reasserts the :root defaults, so no separate dark block is needed. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#FAF7F1;--ground-2:#F0EADC;--rule:rgba(23,17,10,.08);--rule-2:rgba(23,17,10,.16);
    --ink:#1A1620;--ink-2:#5C5568;--ink-3:#8B8494;--khz-txt:#6B3FA0;--coral:#D63F4B;
    --chrome-70:rgba(250,247,241,.75);--chrome-78:rgba(250,247,241,.82);--chrome-9:rgba(250,247,241,.92);
  }
  body:not([data-theme="dark"]){background:#F0EADC}
  :root:not([data-theme="dark"]) .stage{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#F0EADC 60%)}
  :root:not([data-theme="dark"]) .phone{box-shadow:0 0 0 10px #E4DCC9,0 0 0 11px rgba(0,0,0,.05),0 44px 100px -30px rgba(0,0,0,.22)}
  :root:not([data-theme="dark"]) .statusbar{color:var(--ink)}
}
:root[data-theme="light"]{
  --ground:#FAF7F1;--ground-2:#F0EADC;--rule:rgba(23,17,10,.08);--rule-2:rgba(23,17,10,.16);
  --ink:#1A1620;--ink-2:#5C5568;--ink-3:#8B8494;--khz-txt:#6B3FA0;--coral:#D63F4B;
  --chrome-70:rgba(250,247,241,.75);--chrome-78:rgba(250,247,241,.82);--chrome-9:rgba(250,247,241,.92);
}
body[data-theme="light"]{background:#F0EADC}
:root[data-theme="light"] .stage{background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#F0EADC 60%)}
:root[data-theme="light"] .phone{box-shadow:0 0 0 10px #E4DCC9,0 0 0 11px rgba(0,0,0,.05),0 44px 100px -30px rgba(0,0,0,.22)}
:root[data-theme="light"] .statusbar{color:var(--ink)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050406;font-family:var(--f-u);color:var(--ink)}

.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:36px 16px;
  background:radial-gradient(120% 80% at 50% 0%,#16141c 0%,#050406 60%)}
.phone{position:relative;width:393px;height:852px;background:var(--ground);border-radius:46px;overflow:hidden;direction:rtl;
  box-shadow:0 0 0 10px #1e1c22,0 0 0 11px rgba(255,255,255,.06),0 44px 100px -30px rgba(0,0,0,.9)}
@media (max-width:520px){ .stage{padding:0} .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none} }

.statusbar{position:absolute;top:0;inset-inline:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 8px;z-index:60;pointer-events:none;direction:ltr;color:#fff;transition:color 200ms ease}

.tl-v{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--khz-txt);font-family:var(--f-u);
  font-size:11.5px;font-weight:500}
.tl-i.fresh{animation:fu 280ms var(--ease-out)}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.facts{display:flex;flex-wrap:wrap;gap:7px 18px;padding-inline:var(--pad)}
.fact{font-family:var(--f-u);font-size:12px;color:var(--ink-3)}
.fact b{font-weight:500;color:var(--ink-2)}

/* ============================================================
   SHEET / COMPLETION / TOAST
   ============================================================ */
.backdrop{position:absolute;inset:0;z-index:50;background:rgba(3,2,5,.66);opacity:0;visibility:hidden;
  transition:opacity var(--t3) ease,visibility 0s linear var(--t3)}
.backdrop.on{opacity:1;visibility:visible;transition-delay:0s}
.backdrop.dragging{transition:none}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:51;background:var(--ground-2);border-radius:var(--r4) var(--r4) 0 0;
  transform:translateY(101%);transition:transform 320ms var(--e);padding:10px 24px 34px;touch-action:none;
  will-change:transform;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.grab{width:44px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 auto 10px;
  transition:background var(--t1) ease}
.sheet.dragging .grab{background:color-mix(in srgb,var(--ink) 34%,transparent)}
.sh-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.v-ask{font-family:var(--f-u);font-size:22px;font-weight:600;line-height:1.5;margin:14px 0 0}
.v-sub{font-family:var(--f-u);font-size:14px;color:var(--ink-3);margin:7px 0 0}
.mic{width:88px;height:88px;border-radius:50%;background:var(--khz);color:#fff;display:flex;align-items:center;
  justify-content:center;margin:24px 0 0;transition:transform var(--press-out) var(--ease-out),box-shadow var(--t2) ease}
.mic:active{transform:scale(.95);transition-duration:0ms}
.mic.rec{box-shadow:0 0 0 10px rgba(83,50,139,.3)}
.v-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:28px;margin-top:20px;width:100%}
.v-wave i{width:2px;height:4px;background:rgba(176,140,236,.3);transition:height 160ms ease}
.v-wave.live i{background:var(--khz-txt);animation:vb 1.05s ease-in-out infinite alternate}
.v-wave.kept i{height:var(--h);background:rgba(176,140,236,.55)}
@keyframes vb{from{height:5px}to{height:var(--h,14px)}}
.v-time{font-family:var(--f-u);font-size:13px;font-weight:500;color:var(--ink-3);margin-top:10px;
  font-variant-numeric:tabular-nums}
.v-txt{font-family:var(--f-d);font-size:16.5px;line-height:1.9;color:var(--ink-2);margin:14px 0 0;min-height:58px;
  max-width:30ch;display:flex;align-items:center;text-align:center}
.v-txt[contenteditable="true"]{outline:none;box-shadow:0 0 0 1px var(--rule-2);border-radius:var(--r1);padding:6px 10px}
.v-txt:empty::before{content:attr(data-placeholder);color:var(--ink-3)}
.pagebox{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;
  padding:12px 0;border-block:1px solid var(--rule)}
.pagebox .lbl{font-family:var(--f-u);font-size:13.5px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--rule-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper .val{font-family:var(--f-u);font-size:15px;font-weight:600;min-width:46px;text-align:center;
  font-variant-numeric:tabular-nums}
.v-act{display:flex;gap:12px;align-items:center;width:100%;margin-top:20px}
.v-act .btn-fill{flex:1}

.done-h{font-family:var(--f-d);font-size:29px;font-weight:700;line-height:1.48;text-align:center;margin:0;
  padding-inline:var(--pad)}
.stats{display:flex;gap:28px;padding:20px var(--pad);border-block:1px solid var(--rule);margin-inline:var(--pad)}
.stat b{font-family:var(--f-d);font-size:25px;font-weight:700;line-height:1;display:block}
.stat span{font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);display:block;margin-top:7px}
.essay p{font-family:var(--f-d);font-size:17px;line-height:2.05;color:var(--ink);margin:0 0 18px;padding-inline:var(--pad)}
.essay p:last-child{margin-bottom:0}
.done-act{display:flex;gap:10px;align-items:center;padding-inline:var(--pad)}
.done-act .btn-fill{flex:1}

.track{display:flex;align-items:center;gap:12px;padding-inline:var(--pad)}
.track .face{width:32px;height:32px}
.track-b{flex:1;min-width:0}

.toast{position:absolute;bottom:46px;inset-inline:0;z-index:60;display:flex;justify-content:center;pointer-events:none;
  transform:translateY(-58px);transition:transform var(--t2) var(--ease-out)}
.toast.low{transform:none}
.toast div{background:#EFEAF5;color:#131218;font-family:var(--f-u);font-size:13.5px;font-weight:600;padding:11px 18px;
  border-radius:var(--r1);opacity:0;transform:translateY(8px);
  transition:opacity var(--t2) ease,transform var(--t2) var(--ease-out)}
.toast.on div{opacity:1;transform:none}

/* ============================================================
   OPENING — welcome → login/sign-up. One quiet reveal, then done.
   ============================================================ */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 44px}
.w-mark{font-family:var(--f-d);font-size:42px;font-weight:700;color:var(--ink);margin:0;
  opacity:0;transform:translateY(5px) scale(.98);animation:wIn 1000ms var(--ease-out) 160ms forwards}
.w-tag{font-family:var(--f-u);font-size:15px;font-weight:500;color:var(--ink-2);margin:16px 0 0;
  opacity:0;transform:translateY(5px);animation:wIn 900ms var(--ease-out) 820ms forwards}
.w-love{position:absolute;bottom:56px;inset-inline:0;text-align:center;
  font-family:var(--f-u);font-size:11.5px;color:var(--ink-3);opacity:0;animation:wFade 1000ms ease 1650ms forwards}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes wFade{to{opacity:.7}}

.auth-h{font-family:var(--f-d);font-size:27px;font-weight:700;line-height:1.44;margin:14px 0 0}
.field{margin-top:16px}
.field label{display:block;font-family:var(--f-u);font-size:12.5px;font-weight:500;color:var(--ink-3);margin-bottom:8px}
.field input{width:100%;height:50px;border-radius:var(--r2);background:color-mix(in srgb,var(--ink) 6%,transparent);
  box-shadow:inset 0 0 0 1px var(--rule-2);padding:0 16px;font-family:var(--f-u);font-size:15px;color:var(--ink);
  border:0;outline:none;transition:box-shadow var(--t1) ease}
.field input::placeholder{color:var(--ink-3)}
.field input:focus{box-shadow:inset 0 0 0 1.5px var(--khz-txt)}
.field-err{font-family:var(--f-u);font-size:12.5px;color:var(--coral);margin:8px 0 0}

@media (prefers-reduced-motion:reduce){
  :root{--t1:90ms;--t2:110ms;--t3:150ms;--press-out:120ms}
  .screen.ent-push,.screen.ent-pop,.screen.exit-push,.screen.exit-pop{transform:none!important}
  .toast,.toast.low{transform:none!important}
  .grid3>*,.tl-i.fresh{animation:none!important}
  .v-wave.live i{animation:none!important;height:10px!important}
  .seg-ind{transition-duration:90ms!important}
  .w-mark,.w-tag,.w-love{animation:none!important;opacity:1!important;transform:none!important}
}

function syncSegInd(root){
  var box=(root||document).querySelector('.segs');if(!box)return;
  var ind=box.querySelector('.seg-ind'),act=box.querySelector('.seg.on');
  if(!ind||!act)return;
  ind.style.transform='translateX('+act.offsetLeft+'px) scaleX('+act.offsetWidth+')';

function libBody(){
  var ids=MY_LIB[libSeg];
  if(!ids.length){
    var e=EMPTY_LIB[libSeg];
    return '<div class="empty">'+ic('archive',30)+'<h3>'+esc(e.h)+'</h3>'
      +'<p>'+esc(e.p)+'</p>'
      +'<button class="btn btn-fill btn-sm" data-addbook="'+libSeg+'" style="margin-top:8px">'+esc(e.cta)+ic('plus',15)+'</button></div>';
  }
  return '<div class="grid3">'+ids.map(function(i,n){
    return '<div style="--i:'+Math.min(n,6)+'">'+bk(i,'100%')+'</div>';}).join('')+'</div>';

      +'<p>جرّب كلمة ثانية، أو اسم الكاتب.</p></div>';

  return '<div class="rail">'+list.map(function(b){return bk(b.id,110);}).join('')+'</div>';
}

/* ---------- motion primitives ---------- */
/* A spring animates from the CURRENT on-screen value and accepts the finger's
   release velocity, so there is no seam between dragging and animating. */
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function springTo(from,to,v0,opts,onFrame,onDone){
  var response=(opts&&opts.response)||0.34, bounce=(opts&&opts.bounce)||0;
  if(REDUCE){response=0.16;bounce=0;}
  var w=2*Math.PI/response, k=w*w, c=2*(1-bounce)*w;
  var x=from,v=v0||0,last=null,raf;
  function step(t){
    if(last===null)last=t;
    var dt=Math.min((t-last)/1000,1/30);last=t;
    v+=(-k*(x-to)-c*v)*dt; x+=v*dt;
    if(Math.abs(x-to)<0.5&&Math.abs(v)<10){onFrame(to);if(onDone)onDone();return;}
    onFrame(x);raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  return function(){cancelAnimationFrame(raf);};
}
/* Apple's momentum projection — where the flick is going, not where it stopped */
function project(v,d){d=d||0.998;return (v/1000)*d/(1-d);}
/* progressive resistance past the top edge instead of a hard stop */
function rubber(o,dim,c){c=c||0.55;return (o*dim*c)/(dim+c*Math.abs(o));}

var recTimer=null,recSecs=0,recognition=null,recognizing=false;

/* ---------- Arabic-forgiving search over the shared catalog ---------- */
function normalizeAr(s){
  return String(s||'').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[ً-ْ]/g,'').toLowerCase();
}
function searchBooks(query,genre){
  var ids=Object.keys(B);
  if(genre)ids=ids.filter(function(id){return B[id].g===genre;});
  query=(query||'').trim();
  if(query){
    var norm=normalizeAr(query);
    ids=ids.filter(function(id){
      return normalizeAr(B[id].t).indexOf(norm)>-1||normalizeAr(B[id].a).indexOf(norm)>-1;
    });
  }
  return ids.map(function(id){return B[id];});
}

/* ---------- writes: optimistic-update the local cache, then persist ---------- */
function upsertLibraryEntry(bookId,status,page){
  return sb.from('library_entries').upsert(
    {user_id:ME.id,book_id:bookId,status:status,page:page||0,updated_at:new Date().toISOString()},
    {onConflict:'user_id,book_id'}
  ).then(function(res){
    if(res.error){toast('صار خطأ، حاول مرة ثانية.');console.error(res.error);return false;}
    Object.keys(MY_LIB).forEach(function(k){MY_LIB[k]=MY_LIB[k].filter(function(id){return id!==bookId;});});
    MY_LIB[status].unshift(bookId);
    MY_PROGRESS[bookId]=page||0;
    return true;
  });
}
function insertJourneyEntry(bookId,note,durationSec,pageFrom,pageTo,isStart){
  return sb.from('journey_entries').insert({user_id:ME.id,book_id:bookId,note:note||'',
    duration_sec:durationSec||0,page_from:pageFrom==null?null:pageFrom,page_to:pageTo==null?null:pageTo,
    is_start:!!isStart}).select().single().then(function(res){
    if(res.error){toast('صار خطأ، حاول مرة ثانية.');console.error(res.error);return null;}
    if(!MY_JOURNEY[bookId])MY_JOURNEY[bookId]=[];
    MY_JOURNEY[bookId].unshift(res.data);
    return res.data;
  });
}
function insertCollection(title){
  return sb.from('collections').insert({user_id:ME.id,title:title}).select().single().then(function(res){
    if(res.error){toast('صار خطأ، حاول مرة ثانية.');console.error(res.error);return null;}
    MY_COLLECTIONS.unshift({id:res.data.id,title:res.data.title,books:[]});
    return res.data;

}

function openSheet(mode,ctx){
  SHEET_MODE=mode||'log';SHEET_CTX=ctx||{};
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
  sheet.innerHTML=sheetHTML(SHEET_MODE);
  backdrop.classList.add('on');sheet.classList.add('on');
  recSecs=0;

  if(SHEET_MODE==='addbook'){
    var q=document.getElementById('addBookQ'),results=document.getElementById('addBookResults');
    function renderResults(query){
      var list=searchBooks(query);
      results.innerHTML=list.length?list.map(function(b){return addBookRowHTML(b.id);}).join('')
        :'<div class="empty" style="padding:30px 0">'+ic('search',26)+'<h3>ولا كتاب طابق بحثك.</h3>'
          +'<p>جرّب اسمًا ثانيًا أو اسم الكاتب.</p></div>';
    }
    renderResults('');
    q.addEventListener('input',function(){renderResults(q.value);});
    sheet.addEventListener('click',function(e){
      var t=e.target.closest('[data-pickbook]');if(!t)return;
      var bookId=t.dataset.pickbook,status=SHEET_CTX.status||'next';
      closeSheet();
      upsertLibraryEntry(bookId,status,status==='reading'?1:0).then(function(ok){
        if(ok){toast('انضاف إلى مكتبتك.');refreshIfCurrent('library');refreshIfCurrent('home');}
      });
    });
    return;
  }
  if(SHEET_MODE==='newcollection'){
    var titleInput=document.getElementById('collTitle'),collSave=document.getElementById('collSave');
    titleInput.addEventListener('input',function(){collSave.disabled=!titleInput.value.trim();});
    collSave.addEventListener('click',function(){
      var title=titleInput.value.trim();if(!title)return;
      closeSheet();
      insertCollection(title).then(function(row){
        if(row){toast('انسوت مجموعة «'+esc(title)+'».');refreshIfCurrent('library');refreshIfCurrent('community');}
      });
    });
    return;
  }

  /* mode === 'log' (also used, with SHEET_CTX.onboard, for first-run onboarding) —
     real speech-to-text via the Web Speech API, with a type-it-yourself
     fallback where that API doesn't exist (Safari/Firefox). */
  var mic=document.getElementById('mic'),wave=document.getElementById('vWave'),
      time=document.getElementById('vTime'),txt=document.getElementById('vTxt'),
      vsub=document.getElementById('vSub'),
      save=document.getElementById('vSave'),pv=document.getElementById('pgVal');
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var finalTranscript='';

  function stopWave(){wave.classList.remove('live');wave.classList.add('kept');}
  function startWave(){wave.classList.add('live');wave.classList.remove('kept');}

  if(SR){
    mic.addEventListener('click',function(){
      if(recognizing){recognition.stop();return;}
      finalTranscript='';txt.textContent='';txt.contentEditable='false';
      recSecs=0;recognizing=true;
      mic.classList.add('rec');startWave();
      mic.innerHTML=ic('pause',34);time.textContent='0:00';
      recTimer=setInterval(function(){
        recSecs++;time.textContent='0:'+(recSecs<10?'0':'')+recSecs;
        if(recSecs>=119)recognition.stop();
      },1000);
      recognition=new SR();
      recognition.lang='ar-SA';recognition.continuous=true;recognition.interimResults=true;
      recognition.onresult=function(e){
        var interim='';
        for(var i=e.resultIndex;i<e.results.length;i++){
          var piece=e.results[i][0].transcript;
          if(e.results[i].isFinal)finalTranscript+=piece+' ';else interim+=piece;
        }
        txt.textContent=(finalTranscript+interim).trim();
        save.disabled=!txt.textContent.trim();
      };
      recognition.onerror=function(e){
        if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('ما قدرنا نوصل للمايك. تأكد من الإذن.');
        else if(e.error!=='no-speech'&&e.error!=='aborted')toast('صار خطأ بالتسجيل. جرّب مرة ثانية.');
      };
      recognition.onend=function(){
        recognizing=false;
        if(recTimer){clearInterval(recTimer);recTimer=null;}
        mic.classList.remove('rec');stopWave();
        mic.innerHTML=ic('mic',34);
        txt.contentEditable='true';
        save.disabled=!txt.textContent.trim();
      };
      recognition.start();
    });
  }else{
    mic.style.display='none';
    if(vsub)vsub.textContent='المتصفح ما يدعم التحويل الصوتي هنا، اكتب اللي علق معك.';
    txt.contentEditable='true';
    txt.addEventListener('input',function(){save.disabled=!txt.textContent.trim();});
  }
  sheet.addEventListener('click',function(e){
    var s=e.target.closest('[data-step]');
    if(s){STATE.page=Math.max(1,Math.min(B[STATE.book].pages,STATE.page+(+s.dataset.step)*4));pv.textContent=STATE.page;}
  });
  save.addEventListener('click',function(){
    var line=(txt.textContent||'').trim();
    var bookId=STATE.book,onboard=!!SHEET_CTX.onboard;
    var from=MY_PROGRESS[bookId]||0,to=Math.max(from,STATE.page),dur=recSecs;
    closeSheet();
    Promise.all([
      upsertLibraryEntry(bookId,'reading',to),
      insertJourneyEntry(bookId,line,dur,onboard?null:from,to,onboard)
    ]).then(function(){
      if(current&&current.dataset.name==='book'){
        var tl=document.getElementById('timeline');
        if(tl)tl.innerHTML='<div class="tl-line"></div>'+journeyHTML();
      }
      if(onboard){finishOnboarding();}
      else{toast('انحفظت في رحلتك.');refreshIfCurrent('home');}
    });
  });
}
function skipOnboardingVoice(){
  var bookId=STATE.book;
  closeSheet();
  upsertLibraryEntry(bookId,'reading',1).then(function(){finishOnboarding();});
}
function closeSheet(){
  if(recTimer){clearInterval(recTimer);recTimer=null;}
  if(recognizing&&recognition){recognition.onend=null;recognition.stop();recognizing=false;}
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  backdrop.classList.remove('on');sheet.classList.remove('on');
}

/* ---------- the sheet is grabbable: 1:1 tracking, rubber-band, velocity handoff ---------- */
var sheetY=0,cancelSpring=null,drag=null;
function setSheetY(y){
  sheetY=y;
  sheet.style.transform=y?'translateY('+y+'px)':'';
  var h=sheet.offsetHeight||1;
  backdrop.style.opacity=String(Math.max(0,1-(Math.max(0,y)/h)*1.1));
}
sheet.addEventListener('pointerdown',function(e){
  if(!sheet.classList.contains('on'))return;
  if(e.target.closest('button,input,a'))return;
  if(cancelSpring){cancelSpring();cancelSpring=null;}
  drag={id:e.pointerId,y0:e.clientY,base:sheetY,moved:false,hist:[{y:e.clientY,t:e.timeStamp}]};
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0;
  if(!drag.moved){ if(Math.abs(dy)<8)return;
    drag.moved=true;sheet.classList.add('dragging');backdrop.classList.add('dragging'); }
  var y=drag.base+dy, h=sheet.offsetHeight||1;
  if(y<0)y=-rubber(-y,h);
  setSheetY(y);
  drag.hist.push({y:e.clientY,t:e.timeStamp});
  if(drag.hist.length>5)drag.hist.shift();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var moved=drag.moved,hist=drag.hist;drag=null;
  sheet.classList.remove('dragging');backdrop.classList.remove('dragging');
  if(!moved)return;
  var a=hist[0],b=hist[hist.length-1];
  var vel=(b.y-a.y)/Math.max(1,b.t-a.t)*1000;
  var h=sheet.offsetHeight||1;
  if(sheetY+project(vel)>h*0.32||vel>620){
    cancelSpring=springTo(sheetY,h,vel,{response:0.3},setSheetY,function(){
      if(recTimer){clearInterval(recTimer);recTimer=null;}
      sheet.style.transition='none';
      sheet.classList.remove('on');backdrop.classList.remove('on');
      backdrop.style.opacity='';
      requestAnimationFrame(function(){
        sheet.style.transform='';sheetY=0;
        requestAnimationFrame(function(){sheet.style.transition='';});
      });
    });
  }else{
    /* bounce only because a flick preceded it */
    cancelSpring=springTo(sheetY,0,vel,{response:0.34,bounce:0.12},setSheetY,function(){
      sheet.style.transform='';backdrop.style.opacity='';sheetY=0;
    });
  }
}
sheet.addEventListener('pointerup',endDrag);
sheet.addEventListener('pointercancel',endDrag);

/* ---------- delegated interactions ---------- */
var playT=null,playBtn=null;
function stopPlay(){
  if(playT){clearInterval(playT);playT=null;}
  if(playBtn){
    playBtn.classList.remove('on');playBtn.innerHTML=ic('play',15);
    var wv=playBtn.parentNode.querySelector('.wave');
    if(wv)Array.prototype.forEach.call(wv.children,function(c){c.classList.remove('lit');});
    playBtn=null;
  }
}
document.getElementById('phone').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-closesheet]'))){
    if(SHEET_CTX.onboard)skipOnboardingVoice();else closeSheet();
    return;
  }
  if(e.target===backdrop){if(!SHEET_CTX.onboard)closeSheet();return;}
  if((t=e.target.closest('[data-sheet]'))){STATE.page=MY_PROGRESS[STATE.book]||1;openSheet('log');return;}
  if((t=e.target.closest('[data-addbook]'))){openSheet('addbook',{status:t.dataset.addbook});return;}
  if((t=e.target.closest('[data-newcollection]'))){openSheet('newcollection');return;}
  if((t=e.target.closest('[data-shareexp]'))){shareExperience();return;}
  if((t=e.target.closest('[data-topic]'))){STATE.topic=t.dataset.topic;push('topic');return;}
  if((t=e.target.closest('[data-genre]'))){
    STATE.tab='discover';STATE.stack=[];STATE.genreFilter=t.dataset.genre;renderTabs();mount('discover');
    return;
  }
  if((t=e.target.closest('[data-discovergenre]'))){
    var gg=t.dataset.discovergenre;
    STATE.genreFilter=(STATE.genreFilter===gg)?'':gg;
    mount('discover');
    return;
  }
  if((t=e.target.closest('[data-back]'))){stopPlay();back();return;}
  if((t=e.target.closest('[data-tab]'))){stopPlay();goTab(t.dataset.tab);return;}
  if((t=e.target.closest('[data-open]'))){
    var o=t.dataset.open;stopPlay();
    if(o==='book')push('book');
    else if(o==='done')push('done');
    else if(o==='friend')push('friend');
    return;
  }
  if((t=e.target.closest('[data-book]'))){STATE.book=t.dataset.book;stopPlay();push('book');return;}
  if((t=e.target.closest('[data-seg]'))){
    if(t.dataset.seg===libSeg)return;
    libSeg=t.dataset.seg;
    Array.prototype.forEach.call(current.querySelectorAll('.seg'),function(s){s.classList.toggle('on',s.dataset.seg===libSeg);});
    syncSegInd(current);
    document.getElementById('libBody').innerHTML=libBody();
    return;
  }
  if((t=e.target.closest('[data-play]'))){
    var btn=t,wv=btn.parentNode.querySelector('.wave');
    if(playBtn===btn){stopPlay();return;}
    stopPlay();
    playBtn=btn;btn.classList.add('on');btn.innerHTML=ic('pause',15);
    var i=0,bars=wv.children;
    playT=setInterval(function(){
      if(i>=bars.length){stopPlay();return;}
      bars[i].classList.add('lit');i++;
    },110);
    return;
  }
  if((t=e.target.closest('[data-skip]'))){enterAuth();return;}
  if((t=e.target.closest('[data-authtoggle]'))){
    authMode=authMode==='login'?'signup':'login';
    document.getElementById('authBody').innerHTML=authBodyHTML();
    return;
  }
  if((t=e.target.closest('[data-authsubmit]'))){handleAuthSubmit(t);return;}
  if((t=e.target.closest('[data-onboardpick]'))){
    STATE.book=t.dataset.onboardpick;STATE.page=1;
    openSheet('log',{onboard:true});
    return;
  }
  if((t=e.target.closest('[data-logout]'))){handleLogout();return;}
  if((t=e.target.closest('[data-themepick]'))){setTheme(t.dataset.themepick);refreshIfCurrent('account');return;}
  if((t=e.target.closest('[data-toast]'))){toast(t.dataset.toast);return;}
});

/* ---------- font verification: real width comparison, not fonts.check ---------- */
if(document.fonts&&document.fonts.ready){
  var FAMS=['Thick Naskh Swash','IBM Plex Sans Arabic'];
  document.fonts.ready.then(function(){
    return Promise.all(FAMS.map(function(f){
      return document.fonts.load('700 64px "'+f+'"').catch(function(){return [];});
    }));
  }).then(function(){
    var probe=document.createElement('span');
    probe.style.cssText='position:absolute;left:-9999px;top:0;font-size:64px;font-weight:700;white-space:nowrap';
    probe.textContent='وش تقرأ اليوم؟';
    document.body.appendChild(probe);
    function wid(f){probe.style.fontFamily=f;return probe.getBoundingClientRect().width;}
    function has(f){
      return ['monospace','serif','sans-serif'].some(function(g){
        return Math.abs(wid('"'+f+'",'+g)-wid('"__malfa_none__",'+g))>0.5;
      });
    }
    var r=FAMS.map(function(f){return f+': '+(has(f)?'active':'not available');});
    probe.remove();
    console.log('[MALFA fonts] '+r.join(' | '));
  });
}

/* ---------- opening: welcome auto-advances to login/sign-up, unless a session is already active ---------- */
var bootTimer=null;
function enterAuth(){
  if(bootTimer){clearTimeout(bootTimer);bootTimer=null;}
  if(current&&current.dataset.name==='welcome')mount('auth','fade');
}
function handleLogout(){
  var uid=ME&&ME.id;
  function finish(){
    sb.auth.signOut().then(function(){
      ME=null;MY_NAME='';MY_CREATED_AT=null;
      MY_LIB={reading:[],next:[],finished:[],dropped:[]};MY_PROGRESS={};MY_JOURNEY={};MY_COLLECTIONS=[];
      STATE={tab:'home',book:null,topic:null,stack:[],page:1,genreFilter:''};
      authMode='login';
      mount('auth','fade');
    });
  }
  if(uid)logAuthEvent(uid,'sign_out').then(finish,finish);else finish();
}
sb.auth.getSession().then(function(res){
  var session=res.data&&res.data.session;
  if(session){
    ME={id:session.user.id,email:session.user.email};
    touchLastSeen();
    loadAll().then(function(){STATE.tab='home';renderTabs();mount('home');});
  }else{
    mount('welcome');
    bootTimer=setTimeout(enterAuth,REDUCE?700:2600);
  }
});
setInterval(function(){if(ME&&document.visibilityState==='visible')touchLastSeen();},4*60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&ME)touchLastSeen();});
})();
</script>
